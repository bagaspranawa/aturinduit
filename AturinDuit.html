  <script>
/* ============================================================
   UI — shell, navigation and page rendering.
   Everything is re-rendered from state; interaction runs
   through one delegated click handler on document.
   ============================================================ */

const App = {
  page: 'dashboard',

  filter: {
    preset: 'thisMonth',
    custom: { start: U.today(), end: U.today() },
    categoryIds: [],
    pocketIds: [],
    types: [],
    search: '',
  },

  compare: 'prev',
  donutType: 'expense',
  chartNote: '',

  /* ---------- derived ---------- */

  range() { return resolvePreset(App.filter.preset, App.filter.custom); },

  /** Transactions matching every active filter. */
  tx() {
    const r = App.range();
    return Store.query({
      start: r.start, end: r.end,
      types: App.filter.types,
      categoryIds: App.filter.categoryIds,
      pocketIds: App.filter.pocketIds,
      search: App.filter.search,
    });
  },

  /** Same filters, but over the comparison window. */
  txCompare() {
    const cmp = comparisonRange(App.range(), App.compare, App.filter.preset);
    if (!cmp) return { list: [], range: null };
    return {
      range: cmp,
      list: Store.query({
        start: cmp.start, end: cmp.end,
        types: App.filter.types,
        categoryIds: App.filter.categoryIds,
        pocketIds: App.filter.pocketIds,
        search: App.filter.search,
      }),
    };
  },

  money(n, extra = {}) {
    return U.money(n, Object.assign({
      symbol: Store.data.settings.currencySymbol,
      hide: Store.data.settings.hideAmounts,
    }, extra));
  },

  activeFilterCount() {
    return App.filter.categoryIds.length + App.filter.pocketIds.length +
           App.filter.types.length + (App.filter.search ? 1 : 0);
  },

  resetFilters() {
    App.filter.categoryIds = [];
    App.filter.pocketIds = [];
    App.filter.types = [];
    App.filter.search = '';
    render();
  },
};

/* ============================================================
   Theme
   ============================================================ */

/** Matches the desktop breakpoint in styles.css. */
function isWide() {
  return window.matchMedia('(min-width: 900px)').matches;
}

function applyTheme() {
  const pref = Store.data.settings.theme;
  const dark = pref === 'dark' ||
    (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#191917' : '#F6F4F0');
}

/* ============================================================
   Toast
   ============================================================ */

function toast(msg, ico = 'check') {
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon(ico, 16)}<span>${U.escape(msg)}</span>`;
  host.appendChild(el);
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 220);
  }, 2200);
}

/* ============================================================
   Shell
   ============================================================ */

const NAV = [
  { id: 'dashboard',    label: 'Beranda',   ico: 'dashboard' },
  { id: 'transactions', label: 'Transaksi', ico: 'list' },
  { id: '_slot',        label: '',          ico: '' },
  { id: 'pockets',      label: 'Pocket',    ico: 'wallet' },
  { id: 'more',         label: 'Lainnya',   ico: 'settings' },
];

function renderNav() {
  const items = NAV.map(n => {
    if (n.id === '_slot') return `<span class="navitem navitem--slot"></span>`;
    return `<button class="navitem ${App.page === n.id ? 'is-active' : ''}" data-nav="${n.id}">
      ${icon(n.ico, 21)}<span>${n.label}</span>
    </button>`;
  }).join('');

  document.getElementById('nav').innerHTML = `
    <div class="navitem navitem--brand">
      <span class="brand-mark">${icon('wallet', 18)}</span>
      <span>AturinDuit</span>
    </div>
    ${items}
    <button class="fab" data-act="quick-add" aria-label="Catat transaksi">
      ${icon('plus', 24)}<span class="fab__lb">Catat</span>
    </button>`;
}

const PAGE_TITLES = {
  dashboard:    { t: 'Beranda',     s: () => U.fmtRange(App.range().start, App.range().end) },
  transactions: { t: 'Transaksi',   s: () => U.fmtRange(App.range().start, App.range().end) },
  pockets:      { t: 'Pocket',      s: () => `${Store.activePockets().length} pocket aktif` },
  more:         { t: 'Lainnya',     s: () => 'Kategori, data & tampilan' },
  categories:   { t: 'Kategori',    s: () => 'Atur pengelompokan sendiri' },
};

function renderTopbar() {
  const p = PAGE_TITLES[App.page] || PAGE_TITLES.dashboard;
  const back = App.page === 'categories';
  const hidden = Store.data.settings.hideAmounts;

  document.getElementById('topbar').innerHTML = `
    ${back ? `<button class="icon-btn" data-nav="more">${icon('chevron-left', 20)}</button>` : ''}
    <div class="topbar__title">
      <h1>${p.t}</h1>
      <p>${U.escape(p.s())}</p>
    </div>
    <button class="icon-btn ${hidden ? 'is-on' : ''}" data-act="toggle-hide"
      aria-label="Sembunyikan nominal">${icon(hidden ? 'eye-off' : 'eye', 19)}</button>
    ${App.page === 'dashboard' || App.page === 'transactions'
      ? `<button class="icon-btn ${App.activeFilterCount() ? 'is-on' : ''}" data-act="open-filter"
          aria-label="Filter">${icon('filter', 19)}</button>` : ''}`;
}

function render() {
  applyTheme();
  renderNav();
  renderTopbar();
  const view = document.getElementById('view');
  view.innerHTML = ({
    dashboard:    renderDashboard,
    transactions: renderTransactions,
    pockets:      renderPockets,
    more:         renderMore,
    categories:   renderCategories,
  }[App.page] || renderDashboard)();
  view.scrollTop = 0;
}

function go(page) {
  App.page = page;
  App.chartNote = '';
  render();   // render() already returns .view to the top
}

/* ============================================================
   Shared fragments
   ============================================================ */

function filterBar() {
  const f = App.filter;
  const catN = f.categoryIds.length;
  const pocN = f.pocketIds.length;
  const typeN = f.types.length;

  return `<div class="filterbar"><div class="chip-scroll">
    <button class="chip is-active" data-act="open-period">
      ${icon('calendar', 15)}${presetLabel(f.preset)}${icon('chevron-down', 14)}
    </button>
    <button class="chip ${catN ? 'is-active' : ''}" data-act="open-cat-filter">
      ${icon('layers', 15)}Kategori
      ${catN ? `<span class="chip--count">${catN}</span>` : icon('chevron-down', 14)}
    </button>
    <button class="chip ${pocN ? 'is-active' : ''}" data-act="open-pocket-filter">
      ${icon('wallet', 15)}Pocket
      ${pocN ? `<span class="chip--count">${pocN}</span>` : icon('chevron-down', 14)}
    </button>
    <button class="chip ${typeN ? 'is-active' : ''}" data-act="cycle-type">
      ${icon('arrow-left-right', 15)}${typeN ? typeLabel(f.types[0]) : 'Semua jenis'}
    </button>
    ${App.activeFilterCount() ? `<button class="chip" data-act="reset-filter">
      ${icon('x', 14)}Reset</button>` : ''}
  </div></div>`;
}

function typeLabel(t) {
  return { expense: 'Pengeluaran', income: 'Pemasukan', transfer: 'Transfer' }[t] || 'Semua jenis';
}

function emptyState(title, msg, ico = 'list') {
  return `<div class="empty">
    <div class="empty__ico">${icon(ico, 24)}</div>
    <b>${U.escape(title)}</b><p>${U.escape(msg)}</p>
  </div>`;
}

function txRow(t) {
  const cat = Store.category(t.categoryId);
  const pocket = Store.pocket(t.pocketId);

  if (t.type === 'transfer') {
    const to = Store.pocket(t.toPocketId);
    return `<button class="tx-item" data-tx="${t.id}">
      <span class="bubble bubble--transfer tx-item__ico">${icon('arrow-left-right', 19)}</span>
      <span class="tx-item__mid">
        <span class="tx-item__t">Transfer</span>
        <span class="tx-item__s">${U.escape(pocket ? pocket.name : '—')} → ${U.escape(to ? to.name : '—')}</span>
      </span>
      <span class="tx-item__a a-tf">${App.money(t.amount)}</span>
    </button>`;
  }

  const inc = t.type === 'income';
  return `<button class="tx-item" data-tx="${t.id}">
    ${iconBubble(cat ? cat.icon : 'more-horizontal', cat ? cat.color : '#9EA79B', 38, 19, 'tx-item__ico')}
    <span class="tx-item__mid">
      <span class="tx-item__t">${U.escape(t.note || (cat ? cat.name : 'Transaksi'))}</span>
      <span class="tx-item__s">${t.note && cat ? U.escape(cat.name) + ' · ' : ''}${U.escape(pocket ? pocket.name : '—')}</span>
    </span>
    <span class="tx-item__a ${inc ? 'a-in' : 'a-out'}">
      ${inc ? '+' : '−'}${App.money(t.amount).replace('−', '')}
    </span>
  </button>`;
}

function txGroups(list) {
  if (!list.length) return emptyState('Belum ada transaksi', 'Catat pengeluaran pertamamu dengan tombol +');

  const byDate = new Map();
  for (const t of list) {
    if (!byDate.has(t.date)) byDate.set(t.date, []);
    byDate.get(t.date).push(t);
  }

  return [...byDate.entries()].map(([date, items]) => {
    const net = items.reduce((s, t) =>
      s + (t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : 0), 0);
    return `<div class="tx-group">
      <div class="tx-group__head">
        <b>${U.escape(U.fmtDateRelative(date))}</b>
        <span class="${net > 0 ? 'a-in' : ''}">${App.money(net, { sign: true })}</span>
      </div>
      <div class="tx-list">${items.map(txRow).join('')}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   Page — Dashboard
   ============================================================ */

function renderDashboard() {
  const range = App.range();
  const list = App.tx();
  const tot = Store.totals(list);
  const symbolHidden = Store.data.settings.hideAmounts;

  /* ---- hero ---- */
  const hero = `<div class="hero">
    <div class="hero__label">${icon('wallet', 14)} Total saldo semua pocket</div>
    <div class="hero__value">${App.money(Store.totalBalance())}</div>
    <div class="hero__split">
      <div class="hero__cell">
        <span class="bubble bubble--income">${icon('arrow-down-right', 17)}</span>
        <span><span class="k">Pemasukan</span><br><span class="v a-in">${App.money(tot.income)}</span></span>
      </div>
      <div class="hero__cell">
        <span class="bubble bubble--expense">${icon('arrow-up-right', 17)}</span>
        <span><span class="k">Pengeluaran</span><br><span class="v">${App.money(tot.expense)}</span></span>
      </div>
    </div>
    <div class="spread" style="padding-bottom:12px">
      <span class="tiny muted">Selisih periode ini</span>
      <b class="num ${tot.net >= 0 ? 'a-in' : ''}" style="font-size:15px">
        ${App.money(tot.net, { sign: true })}</b>
    </div>
  </div>`;

  /* ---- quick add ---- */
  const quick = `<div class="section">
    <div class="section__head"><h2>Catat cepat</h2>
      <button class="link" data-act="edit-quick">Atur${icon('chevron-right', 13)}</button>
    </div>
    <div class="quick-grid">${quickTiles()}</div>
  </div>`;

  /* ---- trend ---- */
  const { granularity, buckets } = buildBuckets(
    range.start || earliestDate(), range.end || U.today());
  for (const b of buckets) b.values = { income: 0, expense: 0 };
  for (const t of list) {
    if (t.type === 'transfer') continue;
    const b = buckets.find(x => t.date >= x.start && t.date <= x.end);
    if (b) b.values[t.type] += Number(t.amount) || 0;
  }
  const series = [
    { key: 'income',  color: 'var(--income)',  label: 'Pemasukan' },
    { key: 'expense', color: 'var(--expense)', label: 'Pengeluaran' },
  ].filter(s => !App.filter.types.length || App.filter.types.includes(s.key));
  App._buckets = buckets;

  const trendCard = `<div class="card">
    <div class="card__head">
      <h3>Arus kas</h3>
      <span class="tiny muted">${GRANULARITY_LABEL[granularity]}</span>
    </div>
    <div class="wrap-gap tiny muted" style="margin:-6px 0 10px">
      ${series.map(s => `<span class="inline"><i style="width:9px;height:9px;border-radius:3px;
        background:${s.color};display:inline-block"></i>${s.label}</span>`).join('')}
    </div>
    ${Charts.trend(buckets, series, { wide: isWide() })}
    <div class="chart-note" id="note-trend">${U.escape(App.chartNote)}</div>
  </div>`;

  /* ---- composition donut ---- */
  const donutItems = Store.byCategory(list, App.donutType);
  const donutTotal = donutItems.reduce((s, i) => s + i.value, 0);
  const shown = donutItems.slice(0, 6);
  const restVal = donutItems.slice(6).reduce((s, i) => s + i.value, 0);
  if (restVal > 0) shown.push({ id: '_rest', name: 'Lainnya', value: restVal, color: '#B6AE96', icon: 'more-horizontal' });
  App._donut = shown;

  const donutCard = `<div class="card">
    <div class="card__head"><h3>Komposisi</h3></div>
    <div class="segmented" style="margin-bottom:14px">
      <button data-act="donut-type" data-v="expense" data-kind="expense"
        class="${App.donutType === 'expense' ? 'is-active' : ''}">Pengeluaran</button>
      <button data-act="donut-type" data-v="income" data-kind="income"
        class="${App.donutType === 'income' ? 'is-active' : ''}">Pemasukan</button>
    </div>
    <div class="donut-wrap">
      ${Charts.donut(shown, {
        centerTop: App.donutType === 'expense' ? 'KELUAR' : 'MASUK',
        centerMain: symbolHidden ? '••••' : U.compact(donutTotal),
      })}
      <div class="legend">${shown.length ? shown.map(i => `
        <button class="legend__row" ${i.id !== '_rest' ? `data-cat-jump="${i.id}"` : ''}>
          <span class="legend__dot" style="background:${i.color}"></span>
          <span class="legend__lb">${U.escape(i.name)}</span>
          <span class="legend__vl">${symbolHidden ? '••••' : U.compact(i.value)}</span>
          <span class="legend__pc">${U.pct(i.value, donutTotal).toFixed(0)}%</span>
        </button>`).join('') : `<p class="tiny muted">Belum ada data pada periode ini.</p>`}
      </div>
    </div>
  </div>`;

  /* ---- category ranking ---- */
  const rankItems = donutItems.slice(0, 8);
  const rankCard = `<div class="card">
    <div class="card__head">
      <h3>Peringkat kategori</h3>
      <span class="tiny muted">${App.donutType === 'expense' ? 'Pengeluaran' : 'Pemasukan'}</span>
    </div>
    ${rankItems.length
      ? Charts.rank(rankItems, {
          symbol: Store.data.settings.currencySymbol,
          hide: symbolHidden,
          total: donutTotal,
        })
      : `<p class="tiny muted">Belum ada data pada periode ini.</p>`}
  </div>`;

  /* ---- comparison ---- */
  const comparison = renderComparison(list, tot);

  /* ---- cumulative net ---- */
  const cum = [];
  let run = 0;
  for (const b of buckets) {
    run += (b.values.income || 0) - (b.values.expense || 0);
    cum.push({ label: b.label, value: run });
  }
  App._cum = cum;
  const areaCard = `<div class="card">
    <div class="card__head"><h3>Akumulasi selisih</h3>
      <span class="tiny muted">${GRANULARITY_LABEL[granularity]}</span></div>
    <p class="card__sub">Pemasukan dikurangi pengeluaran, ditumpuk sepanjang periode.</p>
    ${Charts.area(cum, { wide: isWide() })}
    <div class="chart-note" id="note-area">${U.escape(App.chartNote)}</div>
  </div>`;

  /* ---- recent ---- */
  const recent = list.slice(0, 6);
  const recentCard = `<div class="section">
    <div class="section__head"><h2>Transaksi terakhir</h2>
      <button class="link" data-nav="transactions">Semua${icon('chevron-right', 13)}</button>
    </div>
    ${recent.length ? `<div class="tx-list">${recent.map(txRow).join('')}</div>`
      : emptyState('Belum ada transaksi', 'Tekan tombol + untuk mulai mencatat.')}
  </div>`;

  return `${filterBar()}${Backup.banner()}${hero}${quick}
    <div class="section"><div class="dash-grid">
      <div class="span2">${trendCard}</div>
      ${donutCard}
      ${rankCard}
      <div class="span2">${comparison}</div>
      <div class="span2">${areaCard}</div>
    </div></div>
    ${recentCard}`;
}

function earliestDate() {
  const dates = Store.data.transactions.map(t => t.date);
  return dates.length ? dates.reduce((a, b) => (a < b ? a : b)) : U.today();
}

function quickTiles() {
  const s = Store.data.settings;
  let ids = s.quickCategoryIds.filter(id => {
    const c = Store.category(id);
    return c && !c.archived;
  });

  if (!ids.length) {
    // auto-pick: most used in the last 90 days, then fill from defaults
    const since = U.key(U.addDays(new Date(), -90));
    const count = new Map();
    for (const t of Store.data.transactions) {
      if (t.date < since || t.type === 'transfer' || !t.categoryId) continue;
      count.set(t.categoryId, (count.get(t.categoryId) || 0) + 1);
    }
    ids = [...count.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
    for (const c of Store.categoriesOf('expense')) {
      if (ids.length >= 7) break;
      if (!ids.includes(c.id)) ids.push(c.id);
    }
  }

  const tiles = ids.slice(0, 7).map(id => {
    const c = Store.category(id);
    if (!c) return '';
    return `<button class="quick-tile" data-quick="${c.id}">
      ${iconBubble(c.icon, c.color, 40, 21, 'quick-tile__ico')}
      <span class="quick-tile__lb">${U.escape(c.name)}</span>
    </button>`;
  }).join('');

  return tiles + `<button class="quick-tile quick-tile--add" data-act="quick-add">
    <span class="bubble quick-tile__ico">${icon('plus', 21)}</span>
    <span class="quick-tile__lb">Lainnya</span>
  </button>`;
}

function renderComparison(list, tot) {
  if (App.compare === 'none' || App.filter.preset === 'all') {
    return `<div class="card">
      <div class="card__head"><h3>Perbandingan</h3></div>
      ${compareModeSwitch()}
      <p class="tiny muted" style="margin-top:12px">
        Pilih mode pembanding untuk melihat selisih antar periode.</p>
    </div>`;
  }

  const { list: prev, range: cmpRange } = App.txCompare();
  const prevTot = Store.totals(prev);

  const cards = [
    { k: 'Pemasukan',  a: tot.income,  b: prevTot.income,  invert: false, ico: 'arrow-down-right' },
    { k: 'Pengeluaran',a: tot.expense, b: prevTot.expense, invert: true,  ico: 'arrow-up-right' },
    { k: 'Selisih',    a: tot.net,     b: prevTot.net,     invert: false, ico: 'scale' },
  ].map(c => `<div class="cmp-card">
      <div class="cmp-card__k">${icon(c.ico, 13)}${c.k}</div>
      <div class="cmp-card__v num">${App.money(c.a, { sign: c.k === 'Selisih' })}</div>
      <div class="inline">
        ${deltaBadge(deltaOf(c.a, c.b), c.invert)}
        <span class="cmp-card__p">dari ${App.money(c.b)}</span>
      </div>
    </div>`).join('');

  // per-category comparison for the currently selected side
  const curCats = Store.byCategory(list, App.donutType);
  const prevCats = Store.byCategory(prev, App.donutType);
  const prevMap = new Map(prevCats.map(c => [c.id, c.value]));
  const ids = new Set([...curCats.map(c => c.id), ...prevCats.map(c => c.id)]);

  const rows = [...ids].map(id => {
    const cur = curCats.find(c => c.id === id);
    const ref = prevCats.find(c => c.id === id);
    const meta = cur || ref;
    return {
      id, name: meta.name, icon: meta.icon, color: meta.color,
      a: cur ? cur.value : 0,
      b: prevMap.get(id) || 0,
      invert: App.donutType === 'expense',
    };
  }).sort((x, y) => Math.max(y.a, y.b) - Math.max(x.a, x.b)).slice(0, 6);

  return `<div class="card">
    <div class="card__head"><h3>Perbandingan</h3></div>
    <p class="card__sub">
      ${U.escape(U.fmtRange(App.range().start, App.range().end))}
      &nbsp;vs&nbsp; ${U.escape(U.fmtRange(cmpRange.start, cmpRange.end))}
    </p>
    ${compareModeSwitch()}
    <div class="cmp-grid" style="margin-top:14px">${cards}</div>
    ${rows.length ? `
      <div class="divider"></div>
      <div class="section__head" style="margin-bottom:2px">
        <h2>Per kategori · ${App.donutType === 'expense' ? 'pengeluaran' : 'pemasukan'}</h2>
      </div>
      ${Charts.compareRows(rows, {
        symbol: Store.data.settings.currencySymbol,
        hide: Store.data.settings.hideAmounts,
        labelA: 'Sekarang',
        labelB: cmpRange.label === 'Periode sebelumnya' ? 'Sebelumnya' : cmpRange.label,
      })}` : ''}
  </div>`;
}

  const opt = [
    ['prev', 'Periode sebelumnya'],
    ['yoy',  'Tahun lalu'],

  return `<div class="segmented">${opt.map(([v, l]) =>

/* ============================================================
   Sheets — every modal in the app.
   A small stack lets one sheet open another and step back
   without losing the state underneath.
   ============================================================ */

const Sheet = {
  stack: [],

  get el()    { return document.getElementById('sheet'); },
  get scrim() { return document.getElementById('scrim'); },

  open(config) {
    Sheet.stack.push(config);
    Sheet.paint();
    // If the sheet is dismissed before this frame lands (a fast double tap),
    // the stack is already empty — don't re-open a scrim over nothing.
    requestAnimationFrame(() => {
      if (!Sheet.stack.length) return;
      Sheet.el.classList.add('is-open');
      Sheet.scrim.classList.add('is-open');
    });
  },

  /** Re-render the top sheet in place (state changed underneath). */
  refresh() {
    if (Sheet.stack.length) Sheet.paint();
  },

  paint() {
    const cfg = Sheet.stack[Sheet.stack.length - 1];
    const canBack = Sheet.stack.length > 1;

    Sheet.el.innerHTML = `
      <div class="sheet__grip"></div>
      <div class="sheet__head">
        ${canBack ? `<button class="icon-btn" data-act="sheet-back">${icon('chevron-left', 19)}</button>` : ''}
        <h3>${U.escape(cfg.title)}</h3>
        ${cfg.headAction || ''}
        <button class="icon-btn" data-act="sheet-close">${icon('x', 19)}</button>
      </div>
      <div class="sheet__body">${cfg.body()}</div>
      ${cfg.foot ? `<div class="sheet__foot">${cfg.foot()}</div>` : ''}`;

    if (cfg.onMount) cfg.onMount(Sheet.el);
  },

  back() {
    if (Sheet.stack.length <= 1) return Sheet.close();
    Sheet.stack.pop();
    Sheet.paint();
  },

  close() {
    Sheet.el.classList.remove('is-open');
    Sheet.scrim.classList.remove('is-open');
    Sheet.stack = [];
    setTimeout(() => { if (!Sheet.stack.length) Sheet.el.innerHTML = ''; }, 280);
  },
};

/* ============================================================
   Quick add / edit transaction
   ============================================================ */

const Draft = {
  type: 'expense',
  amount: '',
  categoryId: null,
  pocketId: null,
  toPocketId: null,
  date: U.today(),
  note: '',
  editingId: null,

  reset(patch = {}) {
    const def = Store.defaultPocket();
    Object.assign(Draft, {
      type: 'expense', amount: '', categoryId: null,
      pocketId: def ? def.id : null, toPocketId: null,
      date: U.today(), note: '', editingId: null,
    }, patch);
    if (!Draft.categoryId && Draft.type !== 'transfer') {
      const first = Store.categoriesOf(Draft.type)[0];
      Draft.categoryId = first ? first.id : null;
    }
  },

  value() { return Number(Draft.amount || 0); },
};

function openQuickAdd(patch = {}) {
  Draft.reset(patch);
  Sheet.open({
    title: Draft.editingId ? 'Ubah transaksi' : 'Catat transaksi',
    body: quickAddBody,
    foot: quickAddFoot,
    onMount: bindQuickAdd,
  });
}

function openEditTx(id) {
  const t = Store.data.transactions.find(x => x.id === id);
  if (!t) return;
  Draft.reset({
    type: t.type, amount: String(t.amount || ''), categoryId: t.categoryId,
    pocketId: t.pocketId, toPocketId: t.toPocketId, date: t.date,
    note: t.note || '', editingId: t.id,
  });
  Sheet.open({
    title: 'Ubah transaksi',
    body: quickAddBody,
    foot: quickAddFoot,
    onMount: bindQuickAdd,
  });
}

function quickAddBody() {
  const sym = Store.data.settings.currencySymbol;
  const amountStr = Draft.amount ? Number(Draft.amount).toLocaleString('id-ID') : '0';
  const isTransfer = Draft.type === 'transfer';
  const cats = Store.categoriesOf(Draft.type === 'income' ? 'income' : 'expense');
  const pockets = Store.activePockets();

  const typeSwitch = `<div class="segmented">
    ${[['expense', 'Pengeluaran'], ['income', 'Pemasukan'], ['transfer', 'Transfer']]
      .map(([v, l]) => `<button data-act="draft-type" data-v="${v}" data-kind="${v}"

  </div>`;

  const amountView = `<div class="amount-view">
    <div class="amount-view__k">${isTransfer ? 'Jumlah transfer'
      : Draft.type === 'income' ? 'Nominal masuk' : 'Nominal keluar'}</div>
    <div class="amount-view__v num ${Draft.amount ? '' : 'is-zero'}">
      <small>${U.escape(sym)}</small>${amountStr}
    </div>
  </div>`;

  const quickAmt = `<div class="quickamt">
    ${[1000, 2000, 5000, 10000, 20000, 50000, 100000, 500000].map(v =>
      `<button data-act="amt-add" data-v="${v}">+${U.compact(v)}</button>`).join('')}
    <button data-act="amt-clear">${icon('x', 13)} Kosongkan</button>
  </div>`;

  const catGrid = isTransfer ? '' : `<div class="field">
    <label class="field__lb">Kategori</label>
    <div class="catgrid">
      ${cats.map(c => `<button class="catcell ${Draft.categoryId === c.id ? 'is-active' : ''}"
        data-act="draft-cat" data-v="${c.id}">
        ${iconBubble(c.icon, c.color, 42, 21, 'catcell__ico')}
        <span class="catcell__lb">${U.escape(c.name)}</span>
      </button>`).join('')}
      <button class="catcell" data-act="new-category" data-v="${Draft.type}">
        <span class="bubble catcell__ico" style="border:1px dashed var(--border)">${icon('plus', 21)}</span>
        <span class="catcell__lb">Baru</span>
      </button>
    </div>

  const pocketRow = (labelText, key) => `<div class="field">
    <label class="field__lb">${labelText}</label>
    <div class="chip-scroll" style="margin:0;padding:0">
      ${pockets.map(p => `<button class="chip ${Draft[key] === p.id ? 'is-active' : ''}"

      </button>`).join('')}
    </div>
  </div>`;

  const dateRow = `<div class="field">
    <label class="field__lb">Tanggal</label>

}

  const dateInput = root.querySelector('#draft-date-input');
  if (dateInput) dateInput.addEventListener('change', (e) => {
    Draft.date = e.target.value || U.today();
    Sheet.refresh();
  });

  const note = root.querySelector('#draft-note');
  if (note) note.addEventListener('input', (e) => { Draft.note = e.target.value; });
}

function saveDraft() {
  const amount = Draft.value();
  if (amount <= 0) return;

  if (Draft.type === 'transfer') {
    if (!Draft.pocketId || !Draft.toPocketId || Draft.pocketId === Draft.toPocketId) {
      toast('Pilih dua pocket yang berbeda', 'alert');
      return;
    }
  }

  const payload = {
    type: Draft.type,
    amount,
    date: Draft.date,
    note: Draft.note.trim(),
    pocketId: Draft.pocketId,
    toPocketId: Draft.type === 'transfer' ? Draft.toPocketId : null,
    categoryId: Draft.type === 'transfer' ? null : Draft.categoryId,
  };

  if (Draft.editingId) {
    Store.updateTx(Draft.editingId, payload);
    toast('Transaksi diperbarui');
  } else {
    Store.addTx(payload);
    toast(`${typeLabel(Draft.type)} ${App.money(amount)} tercatat`);
  }

  Sheet.close();
  render();
}

    return `<div style="margin-bottom:12px">
      <div class="tiny muted" style="margin-bottom:6px">${g.label}</div>

          aria-label="${U.escape(iconLabel(n))}">${icon(n, 21)}</button>`).join('')}
      </div>

  }).join('') || `<p class="tiny muted">Ikon tidak ditemukan. Coba kata lain, mis. "bensin" atau "gaji".</p>`;

function doExport() {
  const text = Store.exportText();
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = Store.exportName();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);

  // A local date key, matching how every other date in the app is stored.
  Store.setSetting('lastBackupAt', U.today());
  toast('File backup diunduh');
  render();
}

          ${icon('folder', 18)}${picked ? 'Ganti file' : 'Pilih file backup'}</button>
        <input type="file" id="import-file" accept="application/json,.json" class="hidden">

        ${picked ? `<div class="card" style="background:var(--surface-2);border:none;box-shadow:none;margin-bottom:14px">
          <div class="inline">${icon('save', 18)}
            <div><b class="tiny">${U.escape(picked.name)}</b>
            <div class="tiny muted">${picked.summary}</div></div>
          </div>
          ${picked.owner ? `<div class="tiny" style="margin-top:8px;color:${
            picked.owner.toLowerCase() === (Store.data.settings.profileName || '').toLowerCase()
              ? 'var(--text-2)' : 'var(--warn)'}">
            ${icon('info', 13)} Berkas ini milik profil <b>${U.escape(picked.owner)}</b>.</div>` : ''}
        </div>` : ''}

        <div class="field">
          <label class="field__lb">Cara menggabungkan</label>
          <div class="segmented">
            <button data-act="import-mode" data-v="replace"
              class="${mode === 'replace' ? 'is-active' : ''}">Ganti total</button>
            <button data-act="import-mode" data-v="merge"
              class="${mode === 'merge' ? 'is-active' : ''}">Gabungkan</button>
          </div>
          <p class="tiny muted" style="margin:8px 2px 0">
            ${mode === 'replace'
              ? 'Semua data di perangkat ini akan diganti isi file. Cocok saat pindah HP atau memulihkan backup.'
              : 'Data yang sudah ada dipertahankan; transaksi, kategori, dan pocket baru dari file akan ditambahkan.'}
          </p>
        </div>`;
    },
    foot: () => `<button class="btn btn--primary btn--block" data-act="do-import"
      ${picked ? '' : 'disabled'}>${icon('upload', 18)}Import sekarang</button>`,
    onMount(root) {
      root.querySelector('#import-file').addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const probe = JSON.parse(text);
          const owner = (probe.profile || (probe.settings || {}).profileName || '').trim();
          picked = {
            name: file.name,
            text,
            owner,
            summary: `${(probe.transactions || []).length} transaksi · ` +
                     `${(probe.pockets || []).length} pocket · ` +
                     `${(probe.categories || []).length} kategori`,
          };
          Sheet.refresh();
        } catch (err) {
          toast('File tidak bisa dibaca', 'alert');
        }
      });
    },
    /* exposed so the delegated handler can reach them */
    api: {
      setMode(v) { mode = v; Sheet.refresh(); },
      run() {
        if (!picked) return;
        try {
          const res = Store.importText(picked.text, mode);
          Sheet.close();
          App.filter.categoryIds = [];
          App.filter.pocketIds = [];
          render();
          toast(res.mode === 'replace'
            ? `Data dipulihkan · ${res.transactions} transaksi`
            : `Digabungkan · +${res.transactions} transaksi`);
        } catch (err) {
          toast(err.message || 'Import gagal', 'alert');
        }
      },
    },
  });
}

/* ============================================================
   Small prompts
   ============================================================ */

/** One small sheet for any single-line text setting. */
function openTextSheet({ title, label, hint, value, placeholder = '', maxLength = 40, onSave }) {
  let val = value;
  Sheet.open({
    title,
    body: () => `<div class="field">
        <label class="field__lb">${label}</label>
        <input class="input" id="text-value" value="${U.escape(val)}"
          maxlength="${maxLength}" placeholder="${U.escape(placeholder)}">
      </div>
      <p class="tiny muted">${hint}</p>`,
    foot: () => `<button class="btn btn--primary btn--block" data-act="save-text">Simpan</button>`,
    onMount(root) {
      const el = root.querySelector('#text-value');
      el.addEventListener('input', (e) => { val = e.target.value; });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); onSave(val); }
      });
      setTimeout(() => el.focus(), 250);
    },
    api: { save: () => onSave(val) },
  });
}

function openSymbolSheet() {
  openTextSheet({
    title: 'Simbol mata uang',
    label: 'Simbol',
    value: Store.data.settings.currencySymbol,
    placeholder: 'Rp',
    maxLength: 5,
    hint: 'Ditampilkan di depan setiap nominal, mis. <b>Rp 25.000</b>.',
    onSave(v) {
      Store.setSetting('currencySymbol', v.trim() || 'Rp');
      Sheet.close();
      render();
      toast('Simbol diperbarui');
    },
  });
}

function openProfileSheet() {
  openTextSheet({
    title: 'Nama profil',
    label: 'Nama',
    value: Store.data.settings.profileName,
    placeholder: 'mis. Bagas',
    maxLength: 24,
    hint: 'Dipakai untuk menamai berkas backup, mis. <b>aturinduit-bagas-2026-07-28.json</b>. ' +
          'Berguna kalau ada dua orang memakai aplikasi ini, supaya berkas kalian tidak tertukar ' +
          'saat di-import. Tidak memengaruhi datamu sama sekali.',
    onSave(v) {
      Store.setSetting('profileName', v.trim());
      Sheet.close();
      render();
      toast('Nama profil disimpan');
    },
  });
}

function openConfirm({ title, message, confirmLabel = 'Ya, lanjutkan', danger = true, onConfirm }) {
  Sheet.open({
    title,
    body: () => `<p style="margin:4px 0 8px">${message}</p>`,
    foot: () => `<div class="btn-row">
      <button class="btn btn--ghost" data-act="sheet-close">Batal</button>
      <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-act="confirm-yes">
        ${U.escape(confirmLabel)}</button>
    </div>`,
    onConfirm,
  });
}

  </script>
  <script>
/* ============================================================
   Main — one delegated listener drives the whole app.
   ============================================================ */

/* ---------- helpers ---------- */

function closest(el, sel) { return el && el.closest ? el.closest(sel) : null; }

function setChartNote(id, text) {
  App.chartNote = text;
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

/* ---------- click routing ---------- */

document.addEventListener('click', (ev) => {
  const t = ev.target;

  /* --- navigation --- */
  const nav = closest(t, '[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }

  /* --- entity taps --- */
  const txBtn = closest(t, '[data-tx]');
  if (txBtn) { openEditTx(txBtn.dataset.tx); return; }

  const pocketBtn = closest(t, '[data-pocket]');
  if (pocketBtn) { openPocketEditor(pocketBtn.dataset.pocket); return; }

  const catBtn = closest(t, '[data-category]');
  if (catBtn) { openCategoryEditor(catBtn.dataset.category); return; }

  const quickBtn = closest(t, '[data-quick]');
  if (quickBtn) {
    const c = Store.category(quickBtn.dataset.quick);
    if (c) openQuickAdd({ type: c.type, categoryId: c.id });
    return;
  }

  /* --- drill into a category from any chart --- */
  const jump = closest(t, '[data-cat-jump]');
  if (jump) {
    const id = jump.dataset.catJump;
    App.filter.categoryIds = App.filter.categoryIds.includes(id) ? [] : [id];
    go('transactions');
    return;
  }

  /* --- chart read-outs --- */
  const bucket = closest(t, '[data-bucket]');
  if (bucket) {
    const b = (App._buckets || [])[+bucket.dataset.bucket];
    if (b) setChartNote('note-trend',
      `${U.fmtRange(b.start, b.end)} · masuk ${App.money(b.values.income)} · keluar ${App.money(b.values.expense)}`);
    return;
  }

  const point = closest(t, '[data-point]');
  if (point) {
    const p = (App._cum || [])[+point.dataset.point];
    if (p) setChartNote('note-area', `${p.label} · akumulasi ${App.money(p.value, { sign: true })}`);
    return;
  }

  const slice = closest(t, '[data-slice]');
  if (slice) {
    const item = (App._donut || [])[+slice.dataset.slice];
    if (item && item.id !== '_rest') {
      App.filter.categoryIds = [item.id];
      go('transactions');
    }
    return;
  }

  /* --- actions --- */
  const btn = closest(t, '[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const v = btn.dataset.v;

  switch (act) {

    /* ---- sheet plumbing ---- */
    case 'sheet-close': Sheet.close(); break;
    case 'sheet-back':  Sheet.back(); break;
    case 'confirm-yes': {
      const cfg = Sheet.stack[Sheet.stack.length - 1];
      Sheet.close();
      if (cfg && cfg.onConfirm) cfg.onConfirm();
      break;
    }

    /* ---- transaction draft ---- */
    case 'quick-add': openQuickAdd(); break;
    case 'transfer':  openTransfer(); break;

    case 'draft-type':
      Draft.type = v;
      if (v === 'transfer') {
        const ps = Store.activePockets();
        if (!Draft.toPocketId || Draft.toPocketId === Draft.pocketId)
          Draft.toPocketId = (ps.find(p => p.id !== Draft.pocketId) || {}).id || null;
      } else {
        const cats = Store.categoriesOf(v);
        if (!cats.some(c => c.id === Draft.categoryId))
          Draft.categoryId = cats[0] ? cats[0].id : null;
      }
      Sheet.refresh();
      break;

    case 'draft-cat':    Draft.categoryId = v; Sheet.refresh(); break;
    case 'draft-pocket': Draft[btn.dataset.key] = v; Sheet.refresh(); break;
    case 'draft-date':
      Draft.date = v === 'today' ? U.today() : U.key(U.addDays(new Date(), -1));
      Sheet.refresh();
      break;

    case 'amt-key':
      if (Draft.amount.length < 13) {
        Draft.amount = (Draft.amount === '' && v === '000') ? '' : (Draft.amount + v);
        Draft.amount = Draft.amount.replace(/^0+(?=\d)/, '');
      }
      Sheet.refresh();
      break;
    case 'amt-back':  Draft.amount = Draft.amount.slice(0, -1); Sheet.refresh(); break;
    case 'amt-clear': Draft.amount = ''; Sheet.refresh(); break;
    case 'amt-add':
      Draft.amount = String(Draft.value() + Number(v));
      Sheet.refresh();
      break;

    case 'save-tx': saveDraft(); break;
    case 'delete-tx':
      openConfirm({
        title: 'Hapus transaksi?',
        message: 'Transaksi ini akan dihapus permanen dan saldo pocket akan menyesuaikan.',
        confirmLabel: 'Hapus',
        onConfirm() { Store.deleteTx(v); toast('Transaksi dihapus'); render(); },
      });
      break;

    /* ---- filters ---- */
    case 'open-filter':        openFilterSheet(); break;
    case 'open-period':        openPeriodSheet(); break;
    case 'open-cat-filter':    openCategoryFilter(); break;
    case 'open-pocket-filter': openPocketFilter(); break;
    case 'reset-filter':       App.resetFilters(); break;

    case 'set-preset':
      App.filter.preset = v;
      Sheet.refresh();
      render();
      break;

    case 'toggle-cat-filter': {
      const set = new Set(App.filter.categoryIds);
      set.has(v) ? set.delete(v) : set.add(v);
      App.filter.categoryIds = [...set];
      Sheet.refresh();
      render();
      break;
    }
    case 'clear-cat-filter': App.filter.categoryIds = []; Sheet.refresh(); render(); break;

    case 'toggle-pocket-filter': {
      const set = new Set(App.filter.pocketIds);
      set.has(v) ? set.delete(v) : set.add(v);
      App.filter.pocketIds = [...set];
      Sheet.refresh();
      render();
      break;
    }
    case 'clear-pocket-filter': App.filter.pocketIds = []; Sheet.refresh(); render(); break;

    case 'cycle-type': {
      const order = [[], ['expense'], ['income'], ['transfer']];
      const cur = JSON.stringify(App.filter.types);
      const i = order.findIndex(o => JSON.stringify(o) === cur);
      App.filter.types = order[(i + 1) % order.length];
      Sheet.refresh();
      render();
      break;
    }
    case 'set-type': App.filter.types = v ? [v] : []; Sheet.refresh(); render(); break;

    /* ---- dashboard toggles ---- */
    case 'donut-type':   App.donutType = v; render(); break;
    case 'compare-mode': App.compare = v; render(); break;

    /* ---- quick shortcuts ---- */
    case 'edit-quick': openQuickPicker(); break;
    case 'toggle-quick': {
      const list = Store.data.settings.quickCategoryIds.slice();
      const i = list.indexOf(v);
      if (i >= 0) list.splice(i, 1);
      else if (list.length >= 7) { toast('Maksimal 7 pintasan', 'info'); break; }
      else list.push(v);
      Store.setSetting('quickCategoryIds', list);
      Sheet.refresh();
      render();
      break;
    }
    case 'clear-quick':
      Store.setSetting('quickCategoryIds', []);
      Sheet.refresh();
      render();
      toast('Pintasan kembali otomatis');
      break;

    /* ---- categories ---- */
    case 'new-category':  openCategoryEditor(null, v); break;
    case 'cat-type':      CatDraft.type = v; Sheet.refresh(); break;
    case 'cat-color':     CatDraft.color = v; Sheet.refresh(); break;
    case 'cat-icon':      CatDraft.icon = v; Sheet.refresh(); break;
    case 'save-category': saveCategory(); break;
    case 'unarchive-category':
      Store.updateCategory(v, { archived: false });
      Sheet.close(); render(); toast('Kategori diaktifkan');
      break;
    case 'delete-category': {
      const used = Store.categoryUsage(v);
      openConfirm({
        title: used ? 'Arsipkan kategori?' : 'Hapus kategori?',
        message: used
          ? `Kategori ini dipakai ${used} transaksi, jadi akan diarsipkan agar riwayat tetap utuh. Ia tidak akan muncul lagi saat mencatat.`
          : 'Kategori ini belum dipakai dan akan dihapus permanen.',
        confirmLabel: used ? 'Arsipkan' : 'Hapus',
        onConfirm() {
          const r = Store.removeCategory(v);
          toast(r.archived ? 'Kategori diarsipkan' : 'Kategori dihapus');
          render();
        },
      });
      break;
    }

    /* ---- pockets ---- */
    case 'new-pocket': openPocketEditor(null); break;
    case 'pk-color':   PocketDraft.color = v; Sheet.refresh(); break;
    case 'pk-icon':    PocketDraft.icon = v; Sheet.refresh(); break;
    case 'save-pocket': savePocket(); break;
    case 'make-default':
      Store.setSetting('defaultPocketId', v);
      Sheet.refresh(); render(); toast('Pocket default diperbarui');
      break;
    case 'unarchive-pocket':
      Store.updatePocket(v, { archived: false });
      Sheet.close(); render(); toast('Pocket diaktifkan');
      break;
    case 'delete-pocket': {
      const used = Store.pocketUsage(v);
      openConfirm({
        title: used ? 'Arsipkan pocket?' : 'Hapus pocket?',
        message: used
          ? `Pocket ini terpakai di ${used} transaksi, jadi akan diarsipkan. Saldonya tidak lagi ikut dihitung di total.`
          : 'Pocket ini belum dipakai dan akan dihapus permanen.',
        confirmLabel: used ? 'Arsipkan' : 'Hapus',
        onConfirm() {
          const r = Store.removePocket(v);
          if (r.error) { toast(r.error, 'alert'); return; }
          Sheet.close();
          toast(r.archived ? 'Pocket diarsipkan' : 'Pocket dihapus');
          render();
        },
      });
      break;
    }

    /* ---- data ---- */
    case 'export': doExport(); break;
    case 'import': openImportSheet(); break;
    case 'pick-file': {
      const input = document.getElementById('import-file');
      if (input) input.click();
      break;
    }
    case 'import-mode': {
      const cfg = Sheet.stack[Sheet.stack.length - 1];
      if (cfg && cfg.api) cfg.api.setMode(v);
      break;
    }
    case 'do-import': {
      const cfg = Sheet.stack[Sheet.stack.length - 1];
      if (cfg && cfg.api) cfg.api.run();
      break;
    }

    /* ---- appearance ---- */
    case 'set-theme':
      Store.setSetting('theme', v);
      render();
      break;
    case 'toggle-hide':
      Store.setSetting('hideAmounts', !Store.data.settings.hideAmounts);
      render();
      break;
    case 'edit-symbol':  openSymbolSheet(); break;
    case 'edit-profile': openProfileSheet(); break;
    case 'save-text': {
      const cfg = Sheet.stack[Sheet.stack.length - 1];
      if (cfg && cfg.api) cfg.api.save();
      break;
    }

    /* ---- backup reminder ---- */
    case 'dismiss-nag':
      Backup.dismissed = true;
      render();
      break;

    /* ---- danger ---- */
    case 'reset-all':
      openConfirm({
        title: 'Hapus semua data?',
        message: 'Seluruh transaksi, pocket, dan kategori kustom akan hilang dari perangkat ini. ' +
                 'Export dulu kalau kamu masih membutuhkannya.',
        confirmLabel: 'Hapus semuanya',
        onConfirm() {
          Store.reset();
          App.resetFilters();
          go('dashboard');
          toast('Data dikembalikan ke awal');
        },
      });
      break;
  }
});

/* ---------- inputs ---------- */

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.act === 'search') {
    App.filter.search = el.value;
    // Re-rendering replaces the input, so put the caret and the scroll
    // position back where the user had them.
    const scroll = document.getElementById('view').scrollTop;
    render();
    const again = document.getElementById('search');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    document.getElementById('view').scrollTop = scroll;
  }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.act === 'pk-kind') {
    PocketDraft.kind = el.value;
  }
});

/* ---------- scrim + keyboard ---------- */

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('scrim').addEventListener('click', () => Sheet.close());
});

document.addEventListener('keydown', (ev) => {
  if (!Sheet.stack.length) return;

  if (ev.key === 'Escape') { Sheet.close(); return; }

  // typing straight into the amount pad on desktop
  const top = Sheet.stack[Sheet.stack.length - 1];
  const isAmountSheet = top && (top.body === quickAddBody);
  const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if (!isAmountSheet || inField) return;

  if (/^[0-9]$/.test(ev.key)) {
    ev.preventDefault();
    if (Draft.amount.length < 13) {
      Draft.amount = (Draft.amount + ev.key).replace(/^0+(?=\d)/, '');
      Sheet.refresh();
    }
  } else if (ev.key === 'Backspace') {
    ev.preventDefault();
    Draft.amount = Draft.amount.slice(0, -1);
    Sheet.refresh();
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    saveDraft();
  }
});

/* ---------- charts re-render when we cross the desktop breakpoint ---------- */

window.matchMedia('(min-width: 900px)').addEventListener('change', () => {
  if (Store.data) render();
});

/* ---------- theme follows the OS when set to auto ---------- */

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (Store.data && Store.data.settings.theme === 'auto') applyTheme();
});

/* ---------- boot ---------- */

function boot() {
  Store.init();
  applyTheme();
  render();
  PWA.init();
  // the storage check resolves a tick later; refresh the label if it's on screen
  setTimeout(() => { if (App.page === 'more') render(); }, 600);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

  </script>
