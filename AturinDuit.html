<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#F6F4F0">
  <meta name="description" content="Pencatat keuangan harian yang ringan — satu file, tanpa server.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
/* ============================================================
   AturinDuit — soft, quiet, mobile-first finance tracker
   ============================================================ */

:root {
  color-scheme: light;

  /* Surfaces — warm paper tones */
  --bg:          #F6F4F0;
  --bg-elev:     #FFFFFF;
  --surface-2:   #F0EDE7;
  --surface-3:   #E9E5DD;
  --border:      #E4DFD6;
  --border-soft: #EFEBE3;

  /* Text */
  --text:   #3D3B36;
  --text-2: #7B776D;
  --text-3: #A9A498;

  /* Brand — muted sage */
  --accent:      #6F8F7D;
  --accent-deep: #5A7767;
  --accent-soft: #E4EDE7;

  /* Semantics */
  --income:      #5F937A;
  --income-soft: #E3EEE7;
  --expense:     #C07E6D;
  --expense-soft:#F6E7E2;
  --transfer:    #7C8AA6;
  --transfer-soft:#E7EAF1;
  --warn:        #C2A063;

  --shadow-sm: 0 1px 2px rgba(61, 59, 54, .05);
  --shadow-md: 0 2px 10px rgba(61, 59, 54, .07);
  --shadow-lg: 0 -6px 30px rgba(61, 59, 54, .13);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --nav-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  color-scheme: dark;

  --bg:          #191917;
  --bg-elev:     #232320;
  --surface-2:   #2B2B27;
  --surface-3:   #33332E;
  --border:      #34342E;
  --border-soft: #2C2C27;

  --text:   #E8E4DA;
  --text-2: #A39F94;
  --text-3: #75726A;

  --accent:      #85A794;
  --accent-deep: #9BBBA8;
  --accent-soft: #2A3630;

  --income:      #7FB295;
  --income-soft: #26332C;
  --expense:     #D2937F;
  --expense-soft:#372A26;
  --transfer:    #93A0BA;
  --transfer-soft:#272B34;
  --warn:        #D2B074;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 2px 10px rgba(0,0,0,.3);
  --shadow-lg: 0 -6px 30px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
*::-webkit-scrollbar-track { background: transparent; }

html, body {
  margin: 0;
  padding: 0;
  /* The document itself never scrolls — .view does. This stops Chrome's
     dynamic URL bar from resizing the layout under the navigation. */
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
a { color: var(--accent-deep); }

.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* ---------- App shell ----------

   The shell is a fixed-height column: header, scrolling content, nav.
   Nothing here is `position: fixed`, on purpose. Chrome on Android places
   fixed elements against the *layout* viewport, which stays as tall as the
   page would be with the URL bar collapsed — so a `bottom: 0` bar sinks
   below the visible area on any scrollable page. Making the nav a normal
   flex item removes that whole class of bug, and `dvh` keeps the column
   matched to whatever is actually on screen.                              */

.app {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  flex: none;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
  background: var(--bg);
}

.topbar__title { flex: 1; min-width: 0; }
.topbar__title h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -.02em;
}
.topbar__title p {
  margin: 1px 0 0;
  font-size: 12.5px;
  color: var(--text-2);
}

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 12px;
  color: var(--text-2);
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  transition: background .15s, color .15s;
  flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.is-on { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; }

/* The scroll container for every page. */
.view {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 26px;
  max-width: 560px;
  width: 100%;
  margin: 0 auto;
}

/* ---------- Generic building blocks ---------- */

.section { margin-top: 18px; }
.section__head {
  display: flex; align-items: center; gap: 8px;
  margin: 0 2px 10px;
}
.section__head h2 {
  margin: 0; font-size: 13px; font-weight: 620;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-2); flex: 1;
}
.section__head .link {
  font-size: 13px; color: var(--accent-deep); font-weight: 550;
  display: inline-flex; align-items: center; gap: 3px;
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 12px; }

/* The dashboard stacks cards, some of them wrapped in a .span2 element for
   the desktop layout — so the `.card + .card` rule above cannot see every
   pair. Owning the spacing with `gap` keeps it even in both layouts. */
.dash-grid { display: grid; gap: 12px; align-items: start; }
.dash-grid .card { margin-top: 0; }
.card__head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
}
.card__head h3 {
  margin: 0; font-size: 14.5px; font-weight: 620; flex: 1;
  letter-spacing: -.01em;
}
.card__sub { font-size: 12px; color: var(--text-3); margin: -8px 0 12px; }

.muted { color: var(--text-2); }
.tiny  { font-size: 12px; }

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 46px; padding: 0 18px;
  border-radius: var(--r-md);
  font-size: 15px; font-weight: 600;
  background: var(--surface-2); color: var(--text);
  transition: filter .15s, background .15s;
}
.btn:active { filter: brightness(.96); }
.btn--primary { background: var(--accent); color: #fff; }
[data-theme="dark"] .btn--primary { color: #12241B; }
.btn--soft    { background: var(--accent-soft); color: var(--accent-deep); }
.btn--danger  { background: var(--expense-soft); color: var(--expense); }
.btn--ghost   { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
.btn--block   { width: 100%; }
.btn--sm      { height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
.btn:disabled { opacity: .45; pointer-events: none; }

.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

/* ---------- Chips ---------- */

.chip-scroll {
  display: flex; gap: 8px;
  overflow-x: auto;
  padding: 2px 16px 2px;
  margin: 0 -16px;
  scrollbar-width: none;
}
.chip-scroll::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 13px;
  border-radius: 999px;
  font-size: 13.5px; font-weight: 550;
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  color: var(--text-2);
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.chip.is-active {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent-deep);
}
.chip--count {
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; font-size: 11px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
}
[data-theme="dark"] .chip--count { color: #12241B; }

/* ---------- Hero balance ---------- */

.hero {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-xl);
  padding: 18px 18px 6px;
  box-shadow: var(--shadow-sm);
}
.hero__label {
  font-size: 12.5px; color: var(--text-2);
  display: flex; align-items: center; gap: 6px;
}
.hero__value {
  font-size: 30px; font-weight: 680; letter-spacing: -.03em;
  margin: 3px 0 2px;
  display: flex; align-items: baseline; gap: 6px;
}
.hero__value small { font-size: 16px; font-weight: 600; color: var(--text-3); }
.hero__split {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-top: 14px;
  border-top: 1px solid var(--border-soft);
  padding: 12px 0 12px;
}
.hero__cell { display: flex; align-items: center; gap: 10px; }
.hero__cell .bubble { width: 34px; height: 34px; flex: none; }
.hero__cell .k { font-size: 11.5px; color: var(--text-2); }
.hero__cell .v { font-size: 15.5px; font-weight: 640; letter-spacing: -.02em; }

.bubble {
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--text-2);
  flex: none;
}
.bubble--income   { background: var(--income-soft);  color: var(--income); }
.bubble--expense  { background: var(--expense-soft); color: var(--expense); }
.bubble--transfer { background: var(--transfer-soft);color: var(--transfer); }

/* ---------- Quick add tiles ---------- */

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.quick-tile {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 11px 6px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center;
  transition: transform .12s, background .15s;
}
.quick-tile:active { transform: scale(.955); }
.quick-tile__ico {
  width: 40px; height: 40px; border-radius: 13px;
  display: grid; place-items: center;
}
.quick-tile__lb {
  font-size: 11px; line-height: 1.25; color: var(--text-2);
  font-weight: 550;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.quick-tile--add .quick-tile__ico {
  background: var(--surface-2); color: var(--text-3);
  border: 1px dashed var(--border);
}

/* ---------- Transaction list ---------- */

.tx-group { margin-top: 16px; }
.tx-group__head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 0 4px 7px;
  font-size: 12.5px; color: var(--text-2);
}
.tx-group__head b { font-weight: 600; color: var(--text); }
.tx-group__head span { margin-left: auto; font-variant-numeric: tabular-nums; }

.tx-list {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  width: 100%; text-align: left;
  border-bottom: 1px solid var(--border-soft);
  transition: background .12s;
}
.tx-item:last-child { border-bottom: none; }
.tx-item:active { background: var(--surface-2); }
.tx-item__ico { width: 38px; height: 38px; border-radius: 12px; }
.tx-item__mid { flex: 1; min-width: 0; }
.tx-item__t {
  display: block;
  font-size: 14.5px; font-weight: 560; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-item__s {
  font-size: 12px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 5px;
}
.tx-item__a {
  font-size: 14.5px; font-weight: 640; letter-spacing: -.02em;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.a-in  { color: var(--income); }
.a-out { color: var(--text); }
.a-tf  { color: var(--transfer); }

/* ---------- Backup reminder ---------- */

.nag {
  display: flex; align-items: center; gap: 11px;
  background: var(--bg-elev);
  border: 1px solid var(--warn);
  border-radius: var(--r-lg);
  padding: 12px 13px;
  margin-top: 14px;
}
.nag__ico { width: 34px; height: 34px; background: var(--surface-2); color: var(--warn); }
.nag__mid { flex: 1; min-width: 0; }
.nag__mid b { display: block; font-size: 13.5px; font-weight: 600; }
.nag__mid span { display: block; font-size: 12px; color: var(--text-2); margin-top: 1px; }
.nag__act { display: flex; align-items: center; gap: 6px; flex: none; }

/* Only stack the buttons when the row genuinely cannot fit. */
@media (max-width: 359px) {
  .nag { flex-wrap: wrap; }
  .nag__act { width: 100%; }
  .nag__act .btn { flex: 1; }
}

/* ---------- Empty state ---------- */

.empty {
  text-align: center;
  padding: 34px 20px;
  color: var(--text-3);
}
.empty__ico {
  width: 54px; height: 54px; border-radius: 18px;
  background: var(--surface-2); color: var(--text-3);
  display: grid; place-items: center; margin: 0 auto 12px;
}
.empty p { margin: 0; font-size: 13.5px; }
.empty b { display: block; color: var(--text-2); font-size: 15px; font-weight: 600; margin-bottom: 3px; }

/* ---------- Charts ---------- */

.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: inherit; }

.donut-wrap {
  display: flex; align-items: center; gap: 14px;
}
.donut-wrap svg { width: 132px; height: 132px; flex: none; }

.legend { flex: 1; min-width: 0; display: grid; gap: 8px; }
/* `min-width: 0` is load-bearing: a <button> used as a grid item keeps its
   automatic minimum size, which for buttons is the full content width — so
   without this the row refuses to shrink and the label never ellipses. */
.legend__row {
  display: flex; align-items: center; gap: 8px;
  width: 100%; min-width: 0; text-align: left;
  font-size: 12.5px;
}
.legend__dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend__lb {
  flex: 1; min-width: 0; color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.legend__vl { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend__pc { color: var(--text-3); width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

.chart-note {
  margin-top: 10px; font-size: 12px; color: var(--text-3);
  text-align: center; min-height: 17px;
}

/* Ranked horizontal bars */
.rank { display: grid; gap: 11px; }
.rank__row { display: flex; align-items: center; gap: 11px; width: 100%; min-width: 0; text-align: left; }
.rank__ico { width: 34px; height: 34px; border-radius: 11px; flex: none; }
.rank__mid { flex: 1; min-width: 0; }
.rank__top { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.rank__nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
.rank__vl { font-weight: 620; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rank__track {
  display: block;
  height: 6px; border-radius: 4px; background: var(--surface-2);
  margin-top: 5px; overflow: hidden;
}
.rank__fill { display: block; height: 100%; border-radius: 4px; transition: width .3s ease; }
.rank__pc { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 3px; }

/* Comparison */
.cmp-grid { display: grid; gap: 10px; }
.cmp-card {
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 12px 13px;
  background: var(--surface-2);
}
.cmp-card__k { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.cmp-card__v { font-size: 19px; font-weight: 670; letter-spacing: -.025em; margin: 3px 0 1px; }
.cmp-card__p { font-size: 11.5px; color: var(--text-3); }
.delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11.5px; font-weight: 620;
  padding: 2px 7px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2);
}
.delta--up   { background: var(--income-soft);  color: var(--income); }
.delta--down { background: var(--expense-soft); color: var(--expense); }
.delta--flat { background: var(--surface-3); color: var(--text-3); }

.cmp-row { display: grid; gap: 5px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); }
.cmp-row:last-child { border-bottom: none; }
.cmp-row__h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cmp-row__h .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
.cmp-bar { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-3); }
.cmp-bar__track { display: block; flex: 1; height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.cmp-bar__fill { display: block; height: 100%; border-radius: 4px; }
.cmp-bar__vl { width: 74px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Pockets ---------- */

.pocket-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  padding: 14px;
  width: 100%; text-align: left;
  box-shadow: var(--shadow-sm);
}
.pocket-card + .pocket-card { margin-top: 10px; }
.pocket-card__ico { width: 44px; height: 44px; border-radius: 14px; }
.pocket-card__mid { flex: 1; min-width: 0; }
.pocket-card__nm { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pocket-card__sub { display: block; font-size: 12px; color: var(--text-3); }
.pocket-card__bal { font-size: 16px; font-weight: 660; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.tag {
  font-size: 10px; font-weight: 650; letter-spacing: .04em;
  text-transform: uppercase;
  padding: 2px 6px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent-deep);
}

.goal-track { display: block; height: 6px; border-radius: 4px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
.goal-fill  { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

/* ---------- Settings / list rows ---------- */

.rows {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  width: 100%; text-align: left;
  border-bottom: 1px solid var(--border-soft);
}
.row:last-child { border-bottom: none; }
.row__ico { width: 34px; height: 34px; border-radius: 11px; flex: none; }
.row__mid { flex: 1; min-width: 0; }
.row__t { display: block; font-size: 14.5px; font-weight: 550; }
.row__s { display: block; font-size: 12px; color: var(--text-3); }
.row__r { color: var(--text-3); display: flex; align-items: center; gap: 8px; font-size: 13px; }

.switch {
  width: 44px; height: 26px; border-radius: 999px;
  background: var(--surface-3); position: relative; flex: none;
  transition: background .18s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: var(--shadow-sm);
  transition: transform .18s;
}
.switch.is-on { background: var(--accent); }
.switch.is-on::after { transform: translateX(18px); }

/* ---------- Bottom nav + FAB ---------- */

.bottomnav {
  position: relative;          /* anchors the FAB to the bar, not the viewport */
  flex: none;
  z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr);
  align-items: center;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--bg-elev);
  border-top: 1px solid var(--border-soft);
}
.navitem {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3); font-size: 10.5px; font-weight: 550;
  height: 100%; justify-content: center;
  transition: color .15s;
}
.navitem.is-active { color: var(--accent-deep); }
.navitem--slot { visibility: hidden; }
.navitem--brand { display: none; }
.fab__lb { display: none; }

.fab {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-b) + 4px);
  z-index: 46;
  width: 56px; height: 56px; border-radius: 20px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(111,143,125,.42);
  transition: transform .14s;
}
[data-theme="dark"] .fab { color: #12241B; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.fab:active { transform: translateX(-50%) scale(.93); }

/* ---------- Sheet ---------- */

/* `visibility` matters as much as `opacity` here: a backdrop-filter on a
   fully transparent element still blurs the page behind it in Chromium,
   so the filter is only attached once the scrim is actually open. */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(38, 36, 32, .34);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .22s, visibility .22s;
}
.scrim.is-open {
  opacity: 1; visibility: visible; pointer-events: auto;
  backdrop-filter: blur(2px);
}

/* Absolute inside .app, so the footer button can never sink below the
   visible area the way a viewport-fixed sheet can on Android. */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 61;
  max-height: 92%;
  display: flex; flex-direction: column;
  background: var(--bg-elev);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--shadow-lg);
  transform: translateY(102%);
  transition: transform .26s cubic-bezier(.32,.72,.28,1);
  padding-bottom: var(--safe-b);
}
.sheet.is-open { transform: translateY(0); }

.sheet__grip {
  width: 38px; height: 4px; border-radius: 3px;
  background: var(--surface-3);
  margin: 9px auto 2px; flex: none;
}
.sheet__head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px 10px; flex: none;
}
.sheet__head h3 { margin: 0; font-size: 17px; font-weight: 640; flex: 1; letter-spacing: -.02em; }
.sheet__body { overflow-y: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
.sheet__foot {
  padding: 12px 16px calc(12px + var(--safe-b));
  border-top: 1px solid var(--border-soft);
  background: var(--bg-elev);
  flex: none;
}

/* ---------- Form controls ---------- */

.field { margin-bottom: 14px; }
.field__lb {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-2); margin-bottom: 6px;
  letter-spacing: .01em;
}
.input, .select, .textarea {
  width: 100%;
  height: 46px; padding: 0 13px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid transparent;
  outline: none;
  transition: border-color .15s, background .15s;
}
.textarea { height: auto; padding: 11px 13px; resize: vertical; min-height: 70px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); background: var(--bg-elev); }
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
                    linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 21px, calc(100% - 12px) 21px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 34px;
}

.segmented {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 3px; padding: 3px;
  background: var(--surface-2);
  border-radius: var(--r-md);
}
.segmented button {
  height: 38px; border-radius: 11px;
  font-size: 13.5px; font-weight: 600; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background .16s, color .16s;
}
.segmented button.is-active { background: var(--bg-elev); color: var(--text); box-shadow: var(--shadow-sm); }
.segmented button.is-active[data-kind="expense"] { color: var(--expense); }
.segmented button.is-active[data-kind="income"]  { color: var(--income); }
.segmented button.is-active[data-kind="transfer"]{ color: var(--transfer); }

/* ---------- Amount pad ---------- */

.amount-view {
  text-align: center;
  padding: 4px 0 12px;
}
.amount-view__k { font-size: 12px; color: var(--text-2); }
.amount-view__v {
  font-size: 38px; font-weight: 680; letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; justify-content: center; gap: 6px;
  min-height: 48px;
}
.amount-view__v small { font-size: 19px; font-weight: 600; color: var(--text-3); }
.amount-view__v.is-zero { color: var(--text-3); }

.quickamt { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.quickamt::-webkit-scrollbar { display: none; }
.quickamt button {
  flex: none; height: 32px; padding: 0 11px;
  border-radius: 10px; font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
}

.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-top: 12px;
}
.key {
  height: 50px;
  border-radius: 13px;
  background: var(--surface-2);
  font-size: 20px; font-weight: 550;
  display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
  transition: background .1s;
}
.key:active { background: var(--surface-3); }
.key--fn { font-size: 14px; font-weight: 620; color: var(--text-2); }

/* ---------- Category picker grid ---------- */

.catgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 8px;
}
.catcell {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px 8px;
  border-radius: var(--r-md);
  border: 1.5px solid transparent;
  transition: border-color .15s, background .15s;
}
.catcell.is-active { border-color: var(--accent); background: var(--accent-soft); }
.catcell__ico { width: 42px; height: 42px; border-radius: 14px; }
.catcell__lb {
  font-size: 10.5px; line-height: 1.25; text-align: center; color: var(--text-2);
  font-weight: 550;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.catcell.is-active .catcell__lb { color: var(--accent-deep); }

/* Icon picker */
.icongrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap: 7px;
}
.iconcell {
  aspect-ratio: 1;
  display: grid; place-items: center;
  border-radius: 13px;
  background: var(--surface-2);
  color: var(--text-2);
  border: 1.5px solid transparent;
}
.iconcell.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 34px; height: 34px; border-radius: 11px;
  border: 2px solid transparent;
  position: relative;
}
.swatch.is-active { border-color: var(--text); }
.swatch.is-active::after {
  content: ""; position: absolute; inset: 3px;
  border-radius: 8px; border: 2px solid var(--bg-elev);
}

/* ---------- Toast ---------- */

.toast-host {
  position: absolute; left: 0; right: 0;
  bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  z-index: 80;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 999px;
  font-size: 13.5px; font-weight: 550;
  box-shadow: var(--shadow-md);
  display: flex; align-items: center; gap: 7px;
  animation: toast-in .25s cubic-bezier(.32,.72,.28,1);
  max-width: 90vw;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }
.toast.is-out { animation: toast-out .2s forwards; }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ---------- Misc ---------- */

.divider { height: 1px; background: var(--border-soft); margin: 14px 0; }
.stack { display: grid; gap: 10px; }
.inline { display: flex; align-items: center; gap: 8px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wrap-gap { display: flex; flex-wrap: wrap; gap: 8px; }
.hidden { display: none !important; }

/* Full-bleed so the sticky backdrop reaches both edges, while the chips
   themselves keep the page's 16px gutter (hence the scoped override). */
.filterbar {
  position: sticky; top: 0; z-index: 30;
  margin: 0 -16px; padding: 6px 0 10px;
  background: linear-gradient(var(--bg) 78%, rgba(246,244,240,0));
}
[data-theme="dark"] .filterbar { background: linear-gradient(var(--bg) 78%, rgba(25,25,23,0)); }
.filterbar .chip-scroll { margin: 0; padding: 2px 16px; }

/* ---------- Desktop ---------- */

@media (min-width: 900px) {

  .app {
    display: grid;
    grid-template-columns: 246px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    max-width: 1180px;
    margin: 0 auto;
  }

  .topbar {
    grid-column: 2; grid-row: 1;
    padding: 22px 28px 12px;
    max-width: 100%;
  }

  .view {
    grid-column: 2; grid-row: 2;
    max-width: 100%;
    padding: 0 28px 40px;
  }

  .bottomnav {
    position: relative;
    grid-column: 1; grid-row: 1 / span 2;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: stretch; justify-content: flex-start;
    gap: 4px;
    padding: 22px 14px;
    border-top: none;
    border-right: 1px solid var(--border-soft);
    background: transparent;
    backdrop-filter: none;
  }
  .navitem {
    flex-direction: row; justify-content: flex-start;
    gap: 11px; height: 44px; padding: 0 12px;
    border-radius: var(--r-md);
    font-size: 14px; font-weight: 550;
  }
  .navitem.is-active { background: var(--accent-soft); }
  .navitem--slot { display: none; }
  .fab__lb { display: inline; }
  .navitem--brand {
    display: flex; align-items: center; gap: 11px;
    height: auto; padding: 0 12px 18px;
    color: var(--text); font-size: 17px; font-weight: 680;
    letter-spacing: -.02em; pointer-events: none;
  }
  .navitem--brand .brand-mark {
    width: 30px; height: 30px; border-radius: 10px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
  }
  [data-theme="dark"] .navitem--brand .brand-mark { color: #12241B; }

  .fab {
    position: static; transform: none;
    width: auto; height: 44px; border-radius: var(--r-md);
    margin-top: 12px; padding: 0 14px;
    display: flex; align-items: center; gap: 9px;
    font-size: 14px; font-weight: 600;
    box-shadow: none;
  }
  .fab:active { transform: scale(.98); }

  .toast-host { bottom: 24px; }

  .dash-grid { grid-template-columns: 1fr 1fr; }
  .dash-grid > .span2 { grid-column: 1 / -1; }

  .sheet {
    left: 50%; bottom: auto; top: 50%;
    transform: translate(-50%, -46%) scale(.98);
    width: min(560px, 94vw);
    max-height: 88%;
    border-radius: var(--r-xl);
    opacity: 0;
    transition: transform .2s ease, opacity .2s ease;

  .sheet.is-open { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .sheet__grip { display: none; }
  .sheet__head { padding-top: 16px; }

  .quick-grid { grid-template-columns: repeat(6, 1fr); }
  .filterbar { margin: 0 -28px; }
  .filterbar .chip-scroll { padding: 2px 28px; }
}

}

}

function iconBubble(name, color, size = 38, iconSize = 20, cls = '') {

/* Translucent wash of a colour that works on both light and dark surfaces. */
function tint(hex, alpha = 0.16) {
  const c = hex.replace('#', '');
  const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;

  <script>
/* ============================================================
   Utils — dates, money formatting, period presets, bucketing.
   Dates are stored as plain 'YYYY-MM-DD' strings so a backup
   file never drifts across timezones.
   ============================================================ */

const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const MONTHS_LONG  = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli',
                      'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const DAYS_SHORT   = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

const U = {

  /* ---------- ids ---------- */
  uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },

  /* ---------- date keys ---------- */
  pad(n) { return String(n).padStart(2, '0'); },

  key(d) {
    return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`;
  },

  parse(k) {
    return new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10));
  },

  today() { return U.key(new Date()); },

  /* ---------- date math (all operate on Date, return Date) ---------- */
  addDays(d, n)   { const x = new Date(d); x.setDate(x.getDate() + n); return x; },
  addMonths(d, n) {
    const x = new Date(d.getFullYear(), d.getMonth() + n, 1);
    // clamp: 31 Jan + 1 month -> 28/29 Feb, never spills into March
    const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
    x.setDate(Math.min(d.getDate(), last));
    return x;
  },
  addYears(d, n) {
    const x = new Date(d);
    x.setFullYear(x.getFullYear() + n);
    return x;
  },

  startOfWeek(d) {                        // Monday-based
    const x = new Date(d);
    const dow = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - dow);
    return x;
  },
  endOfWeek(d)    { return U.addDays(U.startOfWeek(d), 6); },
  startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); },
  endOfMonth(d)   { return new Date(d.getFullYear(), d.getMonth() + 1, 0); },
  startOfQuarter(d) { return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1); },
  endOfQuarter(d)   { return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3 + 3, 0); },
  startOfYear(d)  { return new Date(d.getFullYear(), 0, 1); },
  endOfYear(d)    { return new Date(d.getFullYear(), 11, 31); },

  daysBetween(a, b) {
    return Math.round((U.parse(b) - U.parse(a)) / 86400000) + 1;
  },

  /* ---------- labels ---------- */
  fmtDate(k, style = 'medium') {
    const d = U.parse(k);
    if (style === 'short')  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
    if (style === 'medium') return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    if (style === 'long')   return `${DAYS_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`;
    return k;
  },

  /** "Hari ini" / "Kemarin" / "Sen, 14 Juli 2025" */
  fmtDateRelative(k) {
    const t = U.today();
    if (k === t) return 'Hari ini';
    if (k === U.key(U.addDays(new Date(), -1))) return 'Kemarin';
    if (k === U.key(U.addDays(new Date(), 1)))  return 'Besok';
    const d = U.parse(k);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return `${DAYS_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_LONG[d.getMonth()]}` +
           (sameYear ? '' : ` ${d.getFullYear()}`);
  },

  fmtRange(start, end) {
    if (!start || !end) return 'Semua waktu';
    if (start === end) return U.fmtDate(start, 'medium');
    const a = U.parse(start), b = U.parse(end);
    if (a.getFullYear() === b.getFullYear()) {
      if (a.getMonth() === b.getMonth()) {
        // whole month?
        if (a.getDate() === 1 && b.getDate() === U.endOfMonth(b).getDate())
          return `${MONTHS_LONG[a.getMonth()]} ${a.getFullYear()}`;
        return `${a.getDate()}–${b.getDate()} ${MONTHS_SHORT[b.getMonth()]} ${b.getFullYear()}`;
      }
      if (a.getDate() === 1 && a.getMonth() === 0 && b.getMonth() === 11 && b.getDate() === 31)
        return String(a.getFullYear());
      return `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()} ${MONTHS_SHORT[b.getMonth()]} ${b.getFullYear()}`;
    }
    return `${U.fmtDate(start, 'medium')} – ${U.fmtDate(end, 'medium')}`;
  },

  /* ---------- money ---------- */
  money(n, opts = {}) {
    const { symbol = 'Rp', sign = false, hide = false } = opts;
    if (hide) return `${symbol} ••••••`;
    const abs = Math.abs(Math.round(n));
    const body = abs.toLocaleString('id-ID');
    const pre = sign ? (n > 0 ? '+' : n < 0 ? '−' : '') : (n < 0 ? '−' : '');
    return `${pre}${symbol} ${body}`;
  },

  /** Compact Indonesian scale: 1,2jt / 350rb / 4,5M */
  compact(n) {
    const abs = Math.abs(n);
    const s = n < 0 ? '−' : '';
    const trim = (v) => String(Math.round(v * 10) / 10).replace('.', ',');
    if (abs >= 1e12) return s + trim(abs / 1e12) + 'T';
    if (abs >= 1e9)  return s + trim(abs / 1e9)  + 'M';
    if (abs >= 1e6)  return s + trim(abs / 1e6)  + 'jt';
    if (abs >= 1e3)  return s + trim(abs / 1e3)  + 'rb';
    return s + String(Math.round(abs));
  },

  pct(part, whole) {
    if (!whole) return 0;
    return (part / whole) * 100;
  },

  clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); },

  escape(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
};

/* ============================================================
   Period presets
   ============================================================ */

const PRESETS = [
  { id: 'today',       label: 'Hari ini',          group: 'Cepat' },
  { id: 'yesterday',   label: 'Kemarin',           group: 'Cepat' },
  { id: 'thisWeek',    label: 'Minggu ini',        group: 'Cepat' },
  { id: 'lastWeek',    label: 'Minggu lalu',       group: 'Cepat' },
  { id: 'last7',       label: '7 hari terakhir',   group: 'Cepat' },
  { id: 'thisMonth',   label: 'Bulan ini',         group: 'Bulanan' },
  { id: 'lastMonth',   label: 'Bulan lalu',        group: 'Bulanan' },
  { id: 'last30',      label: '30 hari terakhir',  group: 'Bulanan' },
  { id: 'last90',      label: '90 hari terakhir',  group: 'Bulanan' },
  { id: 'thisQuarter', label: 'Kuartal ini',       group: 'Bulanan' },
  { id: 'lastQuarter', label: 'Kuartal lalu',      group: 'Bulanan' },
  { id: 'thisYear',    label: 'Tahun ini',         group: 'Tahunan' },
  { id: 'lastYear',    label: 'Tahun lalu',        group: 'Tahunan' },
  { id: 'last12m',     label: '12 bulan terakhir', group: 'Tahunan' },
  { id: 'all',         label: 'Semua waktu',       group: 'Tahunan' },
  { id: 'custom',      label: 'Rentang kustom',    group: 'Kustom' },
];

/**
 * Resolve a preset into concrete {start, end} date keys.
 * `all` returns nulls — callers treat that as unbounded.
 */
function resolvePreset(id, custom = {}) {
  const now = new Date();
  const k = U.key;

  switch (id) {
    case 'today':     return { start: k(now), end: k(now) };
    case 'yesterday': { const y = U.addDays(now, -1); return { start: k(y), end: k(y) }; }
    case 'thisWeek':  return { start: k(U.startOfWeek(now)), end: k(U.endOfWeek(now)) };
    case 'lastWeek':  { const w = U.addDays(U.startOfWeek(now), -7);
                        return { start: k(w), end: k(U.addDays(w, 6)) }; }
    case 'last7':     return { start: k(U.addDays(now, -6)),  end: k(now) };
    case 'last30':    return { start: k(U.addDays(now, -29)), end: k(now) };
    case 'last90':    return { start: k(U.addDays(now, -89)), end: k(now) };
    case 'thisMonth': return { start: k(U.startOfMonth(now)), end: k(U.endOfMonth(now)) };
    case 'lastMonth': { const m = U.addMonths(U.startOfMonth(now), -1);
                        return { start: k(U.startOfMonth(m)), end: k(U.endOfMonth(m)) }; }
    case 'thisQuarter': return { start: k(U.startOfQuarter(now)), end: k(U.endOfQuarter(now)) };
    case 'lastQuarter': { const q = U.addMonths(U.startOfQuarter(now), -3);
                          return { start: k(U.startOfQuarter(q)), end: k(U.endOfQuarter(q)) }; }
    case 'thisYear':  return { start: k(U.startOfYear(now)), end: k(U.endOfYear(now)) };
    case 'lastYear':  { const y = U.addYears(now, -1);
                        return { start: k(U.startOfYear(y)), end: k(U.endOfYear(y)) }; }
    case 'last12m':   { const s = U.startOfMonth(U.addMonths(now, -11));
                        return { start: k(s), end: k(U.endOfMonth(now)) }; }
    case 'all':       return { start: null, end: null };
    case 'custom':    return { start: custom.start || U.today(), end: custom.end || U.today() };
    default:          return { start: k(U.startOfMonth(now)), end: k(U.endOfMonth(now)) };
  }
}

function presetLabel(id) {
  return (PRESETS.find(p => p.id === id) || {}).label || 'Periode';
}

/**
 * The period a range is compared against.
 *   prev — the same number of days immediately before
 *   yoy  — the same calendar dates one year earlier
 */
function comparisonRange(range, mode, presetId) {
  if (mode === 'none' || !range.start || !range.end) return null;

  if (mode === 'yoy') {
    return {
      start: U.key(U.addYears(U.parse(range.start), -1)),
      end:   U.key(U.addYears(U.parse(range.end), -1)),
      label: 'Periode sama tahun lalu',
    };
  }

  // Calendar-aware shift keeps "bulan ini" comparing against a whole month,
  // not against a 31-day window that straddles two months.
  const whole = {
    thisMonth: () => { const m = U.addMonths(new Date(), -1);
                       return { start: U.startOfMonth(m), end: U.endOfMonth(m), label: 'Bulan lalu' }; },
    lastMonth: () => { const m = U.addMonths(new Date(), -2);
                       return { start: U.startOfMonth(m), end: U.endOfMonth(m), label: '2 bulan lalu' }; },
    thisYear:  () => { const y = U.addYears(new Date(), -1);
                       return { start: U.startOfYear(y), end: U.endOfYear(y), label: 'Tahun lalu' }; },
    thisQuarter: () => { const q = U.addMonths(U.startOfQuarter(new Date()), -3);
                         return { start: U.startOfQuarter(q), end: U.endOfQuarter(q), label: 'Kuartal lalu' }; },
    thisWeek:  () => { const w = U.addDays(U.startOfWeek(new Date()), -7);
                       return { start: w, end: U.addDays(w, 6), label: 'Minggu lalu' }; },
  }[presetId];

  if (whole) {
    const r = whole();
    return { start: U.key(r.start), end: U.key(r.end), label: r.label };
  }

  const len = U.daysBetween(range.start, range.end);
  const end = U.addDays(U.parse(range.start), -1);
  const start = U.addDays(end, -(len - 1));
  return { start: U.key(start), end: U.key(end), label: 'Periode sebelumnya' };
}

/* ============================================================
   Bucketing — choose a sensible granularity for the trend chart
   ============================================================ */

function pickGranularity(start, end) {
  const days = U.daysBetween(start, end);
  if (days <= 14)  return 'day';
  if (days <= 92)  return 'week';
  if (days <= 800) return 'month';
  return 'year';
}

/**
 * Build the empty time buckets covering [start, end].
 * Each bucket: { key, label, start, end }
 */
function buildBuckets(start, end, granularity) {
  const g = granularity || pickGranularity(start, end);
  const out = [];
  const last = U.parse(end);
  let cursor;

  if (g === 'day') {
    cursor = U.parse(start);
    while (cursor <= last) {
      const k = U.key(cursor);
      out.push({ key: k, start: k, end: k, label: String(cursor.getDate()) });
      cursor = U.addDays(cursor, 1);
    }
  } else if (g === 'week') {
    cursor = U.startOfWeek(U.parse(start));
    while (cursor <= last) {
      const e = U.addDays(cursor, 6);
      out.push({
        key: U.key(cursor),
        start: U.key(cursor),
        end: U.key(e),
        label: `${cursor.getDate()}/${cursor.getMonth() + 1}`,
      });
      cursor = U.addDays(cursor, 7);
    }
  } else if (g === 'month') {
    cursor = U.startOfMonth(U.parse(start));
    while (cursor <= last) {
      const e = U.endOfMonth(cursor);
      out.push({
        key: U.key(cursor),
        start: U.key(cursor),
        end: U.key(e),
        label: MONTHS_SHORT[cursor.getMonth()],
        sub: cursor.getMonth() === 0 ? String(cursor.getFullYear()) : '',
      });
      cursor = U.addMonths(cursor, 1);
    }
  } else {
    cursor = U.startOfYear(U.parse(start));
    while (cursor <= last) {
      out.push({
        key: U.key(cursor),
        start: U.key(cursor),
        end: U.key(U.endOfYear(cursor)),
        label: String(cursor.getFullYear()),
      });
      cursor = U.addYears(cursor, 1);
    }
  }

  return { granularity: g, buckets: out };
}

const GRANULARITY_LABEL = { day: 'Harian', week: 'Mingguan', month: 'Bulanan', year: 'Tahunan' };

/* ============================================================
   Store — the whole app state lives in one JSON object.
   Kept in localStorage while you use it, and exportable to a
   single .json file you can park in Google Drive.
   ============================================================ */

const SCHEMA_VERSION = 1;
const STORAGE_KEY = 'aturinduit.v1';

const DEFAULT_POCKETS = [
  { icon: 'wallet',      name: 'Dompet Tunai',  color: '#C9A26B', kind: 'cash',    initial: 0 },
  { icon: 'landmark',    name: 'Rekening Bank', color: '#8AA7C4', kind: 'bank',    initial: 0 },

];

const DEFAULT_EXPENSE = [
  ['Makan & Minum',    'utensils',        '#C9897A'],
  ['Kopi & Jajan',     'coffee',          '#B79C8E'],
  ['Belanja Harian',   'shopping-cart',   '#D2A26B'],

  ['Sewa / Kos',       'key',             '#A5B7C6'],
  ['Rumah Tangga',     'home',            '#B6AE96'],
  ['Kesehatan',        'pill',            '#83B394'],
  ['Olahraga',         'dumbbell',        '#A8B983'],

];

const DEFAULT_INCOME = [
  ['Gaji',        'briefcase',       '#83B394'],
  ['Bonus & THR', 'award',           '#C6B074'],
  ['Freelance',   'laptop',          '#8AA7C4'],
  ['Usaha',       'store',           '#D2A26B'],
  ['Investasi',   'trending-up',     '#8FA8A0'],

const Store = {
  data: null,

  /* ---------- lifecycle ---------- */

  init() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        Store.data = Store.migrate(JSON.parse(raw));
      } catch (e) {
        console.error('Data rusak, memakai data awal.', e);
        Store.data = Store.seed();
      }
    } else {
      Store.data = Store.seed();
    }
    Store.save();
    return Store.data;
  },

  seed() {
    const pockets = DEFAULT_POCKETS.map((p, i) => ({
      id: U.uid(), name: p.name, icon: p.icon, color: p.color,
      kind: p.kind, initial: p.initial, target: 0, order: i, archived: false,
    }));

    const mk = (list, type) => list.map(([name, ic, color], i) => ({
      id: U.uid(), name, icon: ic, color, type, order: i, archived: false,

      version: SCHEMA_VERSION,

        kind: 'cash', initial: 0, target: 0, order: i, archived: false }, p));
    d.categories = (d.categories || []).map((c, i) => Object.assign(
      { id: U.uid(), name: 'Kategori', icon: 'more-horizontal', color: '#9EA79B',
        type: 'expense', order: i, archived: false }, c));
    d.transactions = (d.transactions || []).map(t => Object.assign(
      { id: U.uid(), type: 'expense', amount: 0, date: U.today(),
        categoryId: null, pocketId: null, toPocketId: null, note: '',
        createdAt: new Date().toISOString() }, t));

    if (!d.pockets.length) d.pockets = Store.seed().pockets;
    if (!d.categories.length) d.categories = Store.seed().categories;
    if (!d.pockets.some(p => p.id === d.settings.defaultPocketId))
      d.settings.defaultPocketId = d.pockets[0].id;

    return d;
  },

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
    } catch (e) {
      console.error('Gagal menyimpan', e);
      toast('Penyimpanan penuh — coba export lalu hapus data lama', 'alert');
    }
  },

  /* ---------- lookups ---------- */

  category(id) { return Store.data.categories.find(c => c.id === id) || null; },
  pocket(id)   { return Store.data.pockets.find(p => p.id === id) || null; },

  categoriesOf(type, { includeArchived = false } = {}) {
    return Store.data.categories
      .filter(c => c.type === type && (includeArchived || !c.archived))
      .sort((a, b) => a.order - b.order);
  },

  activePockets({ includeArchived = false } = {}) {
    return Store.data.pockets
      .filter(p => includeArchived || !p.archived)
      .sort((a, b) => a.order - b.order);
  },

  defaultPocket() {
    return Store.pocket(Store.data.settings.defaultPocketId) || Store.activePockets()[0] || null;
  },

  /* ---------- balances (always computed over ALL transactions) ---------- */

  pocketBalance(pocketId) {
    const p = Store.pocket(pocketId);
    if (!p) return 0;
    let bal = Number(p.initial) || 0;
    for (const t of Store.data.transactions) {
      const amt = Number(t.amount) || 0;
      if (t.type === 'income'  && t.pocketId === pocketId) bal += amt;
      if (t.type === 'expense' && t.pocketId === pocketId) bal -= amt;
      if (t.type === 'transfer') {
        if (t.pocketId === pocketId)   bal -= amt;
        if (t.toPocketId === pocketId) bal += amt;
      }
    }
    return bal;
  },

  totalBalance() {
    return Store.activePockets().reduce((s, p) => s + Store.pocketBalance(p.id), 0);
  },

  /* ---------- transactions ---------- */

  addTx(tx) {
    const rec = Object.assign({
      id: U.uid(), createdAt: new Date().toISOString(),
      type: 'expense', amount: 0, date: U.today(),
      categoryId: null, pocketId: null, toPocketId: null, note: '',
    }, tx);
    Store.data.transactions.push(rec);
    Store.save();
    return rec;
  },

  updateTx(id, patch) {
    const t = Store.data.transactions.find(x => x.id === id);
    if (!t) return null;
    Object.assign(t, patch);
    Store.save();
    return t;
  },

  deleteTx(id) {
    const i = Store.data.transactions.findIndex(x => x.id === id);
    if (i < 0) return null;
    const [removed] = Store.data.transactions.splice(i, 1);
    Store.save();
    return removed;
  },

  /** Filtered + sorted newest first. */
  query(filter = {}) {
    const { start, end, types, categoryIds, pocketIds, search } = filter;
    const q = (search || '').trim().toLowerCase();

    return Store.data.transactions.filter(t => {
      if (start && t.date < start) return false;
      if (end && t.date > end) return false;
      if (types && types.length && !types.includes(t.type)) return false;
      if (categoryIds && categoryIds.length) {
        if (t.type === 'transfer') return false;
        if (!categoryIds.includes(t.categoryId)) return false;
      }
      if (pocketIds && pocketIds.length) {
        const hit = pocketIds.includes(t.pocketId) ||
                    (t.type === 'transfer' && pocketIds.includes(t.toPocketId));
        if (!hit) return false;
      }
      if (q) {
        const cat = Store.category(t.categoryId);
        const hay = `${t.note || ''} ${cat ? cat.name : ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) =>
      b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt)));
  },

  /** Income / expense / net for a set of transactions. */
  totals(list) {
    let income = 0, expense = 0;
    for (const t of list) {
      const a = Number(t.amount) || 0;
      if (t.type === 'income') income += a;
      else if (t.type === 'expense') expense += a;
    }
    return { income, expense, net: income - expense, count: list.length };
  },

  /** Aggregate per category, biggest first. */
  byCategory(list, type) {
    const map = new Map();
    for (const t of list) {
      if (t.type !== type) continue;
      const key = t.categoryId || '_none';
      map.set(key, (map.get(key) || 0) + (Number(t.amount) || 0));
    }
    return [...map.entries()]
      .map(([id, value]) => {
        const c = Store.category(id);
        return {
          id,
          value,
          name: c ? c.name : 'Tanpa kategori',
          icon: c ? c.icon : 'more-horizontal',
          color: c ? c.color : '#9EA79B',
        };
      })
      .sort((a, b) => b.value - a.value);
  },

  /* ---------- categories ---------- */

  addCategory(cat) {
    const siblings = Store.categoriesOf(cat.type, { includeArchived: true });
    const rec = Object.assign({
      id: U.uid(), name: 'Kategori baru', icon: 'more-horizontal',
      color: PALETTE[0], type: 'expense', archived: false,
      order: siblings.length,
    }, cat);
    Store.data.categories.push(rec);
    Store.save();
    return rec;
  },

  updateCategory(id, patch) {
    const c = Store.category(id);
    if (!c) return null;
    Object.assign(c, patch);
    Store.save();
    return c;
  },

  categoryUsage(id) {
    return Store.data.transactions.filter(t => t.categoryId === id).length;
  },

  /** Delete outright when unused; otherwise archive so history stays intact. */
  removeCategory(id) {
    const used = Store.categoryUsage(id);
    if (used > 0) {
      Store.updateCategory(id, { archived: true });
      return { archived: true, used };
    }
    Store.data.categories = Store.data.categories.filter(c => c.id !== id);
    Store.data.settings.quickCategoryIds =
      Store.data.settings.quickCategoryIds.filter(x => x !== id);
    Store.save();
    return { archived: false, used: 0 };
  },

  /* ---------- pockets ---------- */

  addPocket(p) {
    const rec = Object.assign({
      id: U.uid(), name: 'Pocket baru', icon: 'wallet', color: PALETTE[6],
      kind: 'cash', initial: 0, target: 0, archived: false,
      order: Store.data.pockets.length,
    }, p);
    Store.data.pockets.push(rec);
    Store.save();
    return rec;
  },

  updatePocket(id, patch) {
    const p = Store.pocket(id);
    if (!p) return null;
    Object.assign(p, patch);
    Store.save();
    return p;
  },

  pocketUsage(id) {
    return Store.data.transactions
      .filter(t => t.pocketId === id || t.toPocketId === id).length;
  },

  removePocket(id) {
    if (Store.data.pockets.filter(p => !p.archived).length <= 1)
      return { error: 'Minimal harus ada satu pocket aktif.' };

    const used = Store.pocketUsage(id);
    if (used > 0) {
      Store.updatePocket(id, { archived: true });
      if (Store.data.settings.defaultPocketId === id)
        Store.data.settings.defaultPocketId = Store.activePockets()[0].id;
      Store.save();
      return { archived: true, used };
    }
    Store.data.pockets = Store.data.pockets.filter(p => p.id !== id);
    if (Store.data.settings.defaultPocketId === id)
      Store.data.settings.defaultPocketId = Store.activePockets()[0].id;
    Store.save();
    return { archived: false, used: 0 };
  },

  /* ---------- settings ---------- */

  setSetting(key, value) {
    Store.data.settings[key] = value;
    Store.save();
  },

  /* ---------- backup file ---------- */

  /** Includes the profile name so two people's backups never look alike. */
  exportName() {
    const slug = (Store.data.settings.profileName || '')
      .toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 24);
    return `aturinduit-${slug ? slug + '-' : ''}${U.today()}.json`;
  },

  exportText() {
    const payload = Object.assign({}, Store.data, {
      exportedAt: new Date().toISOString(),
      app: 'AturinDuit',
      profile: Store.data.settings.profileName || '',
      version: SCHEMA_VERSION,
    });
    return JSON.stringify(payload, null, 2);
  },

  /**
   * mode 'replace' — the file becomes your data
   * mode 'merge'   — keep what you have, add anything new from the file
   */
  importText(text, mode = 'replace') {
    let incoming;
    try {
      incoming = JSON.parse(text);
    } catch {
      throw new Error('File bukan JSON yang valid.');
    }
    if (!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.transactions))
      throw new Error('Struktur file tidak dikenali — pastikan ini backup AturinDuit.');

    const clean = Store.migrate(incoming);

    if (mode === 'replace') {
      Store.data = clean;
      Store.save();
      return { pockets: clean.pockets.length, categories: clean.categories.length,
               transactions: clean.transactions.length, mode };
    }

    // merge — id collisions are skipped, names are matched so categories
    // from a second device don't duplicate
    const cur = Store.data;
    let addedTx = 0, addedCat = 0, addedPocket = 0;

    const pocketMap = new Map();
    for (const p of clean.pockets) {
      const match = cur.pockets.find(x => x.id === p.id) ||
                    cur.pockets.find(x => x.name.toLowerCase() === p.name.toLowerCase());
      if (match) { pocketMap.set(p.id, match.id); continue; }
      const rec = Object.assign({}, p, { order: cur.pockets.length });
      cur.pockets.push(rec);
      pocketMap.set(p.id, rec.id);
      addedPocket++;
    }

    const catMap = new Map();
    for (const c of clean.categories) {
      const match = cur.categories.find(x => x.id === c.id) ||
                    cur.categories.find(x => x.type === c.type &&
                                             x.name.toLowerCase() === c.name.toLowerCase());
      if (match) { catMap.set(c.id, match.id); continue; }
      const rec = Object.assign({}, c, { order: cur.categories.length });
      cur.categories.push(rec);
      catMap.set(c.id, rec.id);
      addedCat++;
    }

    const seen = new Set(cur.transactions.map(t => t.id));
    for (const t of clean.transactions) {
      if (seen.has(t.id)) continue;
      cur.transactions.push(Object.assign({}, t, {
        categoryId: catMap.get(t.categoryId) || t.categoryId,
        pocketId:   pocketMap.get(t.pocketId) || t.pocketId,
        toPocketId: t.toPocketId ? (pocketMap.get(t.toPocketId) || t.toPocketId) : null,
      }));
      seen.add(t.id);
      addedTx++;
    }

    Store.save();
    return { pockets: addedPocket, categories: addedCat, transactions: addedTx, mode };
  },

  reset() {
    Store.data = Store.seed();
    Store.save();
  },
};

  </script>
  <script>
/* ============================================================
   Charts — plain SVG, no libraries, no network.
   Every renderer returns a markup string; interaction is wired
   by delegated listeners in ui.js via data-* attributes.
   ============================================================ */

const Charts = {

  /* ---------------------------------------------------------
     Donut — composition of a single period
     --------------------------------------------------------- */
  donut(items, opts = {}) {
    const { size = 132, thickness = 16, centerTop = '', centerMain = '' } = opts;
    const r = (size - thickness) / 2 - 2;
    const c = size / 2;
    const circ = 2 * Math.PI * r;
    const total = items.reduce((s, i) => s + i.value, 0);

    if (!total) {
      return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
        <circle cx="${c}" cy="${c}" r="${r}" fill="none"
                stroke="var(--surface-2)" stroke-width="${thickness}"/>
        <text x="${c}" y="${c + 4}" text-anchor="middle"
              fill="var(--text-3)" font-size="11">Belum ada data</text>
      </svg>`;
    }

    let offset = 0;
    const arcs = items.map((item, idx) => {
      const frac = item.value / total;
      const len = Math.max(frac * circ - 2, 0.6);   // small gap between slices
      const seg = `<circle cx="${c}" cy="${c}" r="${r}" fill="none"
          stroke="${item.color}" stroke-width="${thickness}" stroke-linecap="butt"
          stroke-dasharray="${len.toFixed(2)} ${(circ - len).toFixed(2)}"
          stroke-dashoffset="${(-offset).toFixed(2)}"
          data-slice="${idx}" style="cursor:pointer"><title>${U.escape(item.name)}</title></circle>`;
      offset += frac * circ;
      return seg;
    }).join('');

    return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <g transform="rotate(-90 ${c} ${c})">${arcs}</g>
      ${centerTop ? `<text x="${c}" y="${c - 6}" text-anchor="middle"
        fill="var(--text-3)" font-size="9.5" letter-spacing=".04em">${U.escape(centerTop)}</text>` : ''}
      ${centerMain ? `<text x="${c}" y="${c + 10}" text-anchor="middle"
        fill="var(--text)" font-size="15" font-weight="650">${U.escape(centerMain)}</text>` : ''}
    </svg>`;
  },

  /* ---------------------------------------------------------
     Grouped bars — income vs expense across time buckets
     --------------------------------------------------------- */
  trend(buckets, series, opts = {}) {
    // The viewBox tracks the rendered width so label text keeps its real
    // pixel size instead of being scaled up on a wide screen.
    const W = opts.wide ? 760 : 340;
    const H = opts.wide ? 250 : 178;
    const padL = 36, padR = 6, padT = 10, padB = 26;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = buckets.length;

    if (!n) return Charts.blank(W, H);

    let max = 0;
    for (const b of buckets)
      for (const s of series) max = Math.max(max, b.values[s.key] || 0);
    const scaleMax = niceCeil(max);

    const y = (v) => padT + plotH - (scaleMax ? (v / scaleMax) * plotH : 0);
    const slot = plotW / n;
    const maxBar = opts.wide ? 28 : 12;
    const barW = Math.max(3, Math.min(maxBar, (slot * 0.72) / series.length));
    const groupW = barW * series.length + (series.length - 1) * 2;

    // horizontal grid + value labels (only the baseline when there is nothing to scale)
    const levels = scaleMax > 0 ? [0, 0.5, 1] : [0];
    const grid = levels.map(f => {
      const gy = padT + plotH - f * plotH;
      return `<line x1="${padL}" x2="${W - padR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}"
                stroke="var(--border-soft)" stroke-width="1"/>
              <text x="${padL - 6}" y="${(gy + 3.5).toFixed(1)}" text-anchor="end"
                fill="var(--text-3)" font-size="9">${f === 0 ? '0' : U.compact(scaleMax * f)}</text>`;
    }).join('');

    const bars = buckets.map((b, i) => {
      const cx = padL + slot * i + slot / 2;
      const x0 = cx - groupW / 2;
      const rects = series.map((s, j) => {
        const v = b.values[s.key] || 0;
        const top = y(v);
        const h = Math.max(v > 0 ? 2 : 0, padT + plotH - top);
        const bx = x0 + j * (barW + 2);
        return `<rect x="${bx.toFixed(1)}" y="${(padT + plotH - h).toFixed(1)}"
            width="${barW.toFixed(1)}" height="${h.toFixed(1)}"
            rx="${Math.min(3, barW / 2).toFixed(1)}" fill="${s.color}"/>`;
      }).join('');
      return rects +
        `<rect x="${(padL + slot * i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}"
           height="${plotH}" fill="transparent" data-bucket="${i}" style="cursor:pointer"/>`;
    }).join('');

    // thin out x labels so they never collide
    const step = Math.ceil(n / (W / 46));
    const xlabels = buckets.map((b, i) => {
      if (i % step !== 0 && i !== n - 1) return '';
      const cx = padL + slot * i + slot / 2;
      return `<text x="${cx.toFixed(1)}" y="${H - 10}" text-anchor="middle"
        fill="var(--text-3)" font-size="9.5">${U.escape(b.label)}</text>`;
    }).join('');

    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      data-chart="trend">${grid}${bars}${xlabels}</svg>`;
  },

  /* ---------------------------------------------------------
     Area — cumulative net across the period
     --------------------------------------------------------- */
  area(points, opts = {}) {
    const W = opts.wide ? 760 : 340;
    const H = opts.wide ? 210 : 150;
    const padL = 36, padR = 6, padT = 12, padB = 24;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = points.length;
    if (n < 1) return Charts.blank(W, H);

    const vals = points.map(p => p.value);
    let lo = Math.min(0, ...vals);
    let hi = Math.max(0, ...vals);
    if (hi === lo) hi = lo + 1;
    const pad = (hi - lo) * 0.12;
    lo -= pad; hi += pad;

    const x = (i) => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
    const y = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

    const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');
    const zeroY = y(0);
    const fill = `${line} L${x(n - 1).toFixed(1)} ${zeroY.toFixed(1)} L${x(0).toFixed(1)} ${zeroY.toFixed(1)} Z`;
    const last = points[n - 1];
    const col = last.value >= 0 ? 'var(--income)' : 'var(--expense)';

    const gid = 'ag' + Math.random().toString(36).slice(2, 7);
    const step = Math.ceil(n / (W / 46));
    const xlabels = points.map((p, i) => {
      if (i % step !== 0 && i !== n - 1) return '';
      return `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle"
        fill="var(--text-3)" font-size="9.5">${U.escape(p.label)}</text>`;
    }).join('');

    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      data-chart="area">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="${padL}" x2="${W - padR}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}"
        stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${padL - 6}" y="${(zeroY + 3.5).toFixed(1)}" text-anchor="end"
        fill="var(--text-3)" font-size="9">0</text>
      <text x="${padL - 6}" y="${(padT + 4).toFixed(1)}" text-anchor="end"
        fill="var(--text-3)" font-size="9">${U.compact(hi)}</text>
      <path d="${fill}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x(n - 1).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="3.2"
        fill="${col}" stroke="var(--bg-elev)" stroke-width="2"/>
      ${points.map((p, i) => `<rect x="${(x(i) - plotW / n / 2).toFixed(1)}" y="${padT}"
        width="${(plotW / n).toFixed(1)}" height="${plotH}" fill="transparent"
        data-point="${i}" style="cursor:pointer"/>`).join('')}
      ${xlabels}
    </svg>`;
  },

  blank(W, H) {
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">
      <text x="${W / 2}" y="${H / 2}" text-anchor="middle"
        fill="var(--text-3)" font-size="11">Belum ada data</text></svg>`;
  },

  /* ---------------------------------------------------------
     Ranked horizontal bars (HTML, not SVG — crisper text)
     --------------------------------------------------------- */
  rank(items, opts = {}) {
    const { symbol = 'Rp', hide = false, max = 0, total = 0, clickable = true, activeId = null } = opts;
    const top = max || Math.max(...items.map(i => i.value), 1);

    return `<div class="rank">${items.map(it => {
      const w = U.clamp((it.value / top) * 100, 2, 100);
      const share = total ? U.pct(it.value, total) : 0;
      const tag = clickable ? 'button' : 'div';
      return `<${tag} class="rank__row" ${clickable ? `data-cat-jump="${it.id}"` : ''}
          style="${activeId && activeId !== it.id ? 'opacity:.45' : ''}">
        ${iconBubble(it.icon, it.color, 34, 18, 'rank__ico')}
        <span class="rank__mid">
          <span class="rank__top">
            <span class="rank__nm">${U.escape(it.name)}</span>
            <span class="rank__vl">${U.money(it.value, { symbol, hide })}</span>
          </span>
          <span class="rank__track"><span class="rank__fill"
            style="width:${w.toFixed(1)}%;background:${it.color}"></span></span>
          ${total ? `<span class="rank__pc">${share.toFixed(1)}% dari total</span>` : ''}
        </span>
      </${tag}>`;
    }).join('')}</div>`;
  },

  /* ---------------------------------------------------------
     Side-by-side comparison rows (current vs comparison period)
     --------------------------------------------------------- */
  compareRows(rows, opts = {}) {
    const { symbol = 'Rp', hide = false, labelA = 'Sekarang', labelB = 'Pembanding' } = opts;
    const top = Math.max(...rows.flatMap(r => [r.a, r.b]), 1);

    return `<div>${rows.map(r => {
      const wa = U.clamp((r.a / top) * 100, 0, 100);
      const wb = U.clamp((r.b / top) * 100, 0, 100);
      const d = deltaOf(r.a, r.b);
      return `<div class="cmp-row">
        <div class="cmp-row__h">
          ${iconBubble(r.icon, r.color, 26, 14)}
          <span class="nm">${U.escape(r.name)}</span>
          ${deltaBadge(d, r.invert)}
        </div>
        <div class="cmp-bar">
          <span style="width:56px">${U.escape(labelA)}</span>
          <span class="cmp-bar__track"><span class="cmp-bar__fill"
            style="width:${wa.toFixed(1)}%;background:${r.color}"></span></span>
          <span class="cmp-bar__vl">${U.money(r.a, { symbol, hide })}</span>
        </div>
        <div class="cmp-bar">
          <span style="width:56px">${U.escape(labelB)}</span>
          <span class="cmp-bar__track"><span class="cmp-bar__fill"
            style="width:${wb.toFixed(1)}%;background:${r.color};opacity:.38"></span></span>
          <span class="cmp-bar__vl">${U.money(r.b, { symbol, hide })}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  },
};

/* ---------- helpers ---------- */

/** Round an axis maximum up to something readable (1, 2, 2.5 or 5 × 10ⁿ). */
function niceCeil(v) {
  if (v <= 0) return 0;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const f = v / base;
  const step = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return step * base;
}

/**
 * Percentage change from b (comparison) to a (current).
 * Returns null when there is no baseline to compare against.
 */
function deltaOf(a, b) {
  if (!b) return a ? null : 0;
  return ((a - b) / Math.abs(b)) * 100;
}

/**
 * `invert` flips the colour meaning: for expenses, going up is bad.
 */
function deltaBadge(d, invert = false) {
  if (d === null) return `<span class="delta delta--flat">baru</span>`;
  if (Math.abs(d) < 0.05) return `<span class="delta delta--flat">0%</span>`;
  const up = d > 0;
  const good = invert ? !up : up;
  const cls = good ? 'delta--up' : 'delta--down';
  const arrow = icon(up ? 'arrow-up' : 'arrow-down', 11);
  const val = Math.abs(d) >= 1000 ? '>999' : Math.abs(d).toFixed(Math.abs(d) < 10 ? 1 : 0);
  return `<span class="delta ${cls}">${arrow}${val}%</span>`;
}

  <script>
/* ============================================================
   PWA glue — installability, offline, and storage durability.

   All of this is optional by design: opened straight from a
   file:// path none of it runs, and the app behaves exactly as
   it always has.
   ============================================================ */

const PWA = {
  hosted: location.protocol === 'http:' || location.protocol === 'https:',
  persisted: null,          // null = unknown, true/false once checked

  init() {
    if (!PWA.hosted) return;   // service workers require a secure origin
    PWA.linkManifest();
    PWA.registerWorker();
    PWA.requestPersistence();
  },

  /** Added from script so a file:// run doesn't log a 404 for the manifest. */
  linkManifest() {
    if (document.querySelector('link[rel="manifest"]')) return;
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.json';
    document.head.appendChild(link);
  },

  registerWorker() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker tidak aktif:', err.message);
      });
    });
  },

  /**
   * Asks the browser not to evict our data when storage runs low.
   * Chrome usually grants this once the app has been installed.
   * It does NOT protect against the user clearing site data by hand —
   * that is what the backup reminder is for.
   */
  async requestPersistence() {
    if (!navigator.storage || !navigator.storage.persist) return;
    try {
      PWA.persisted = await navigator.storage.persisted();
      if (!PWA.persisted) PWA.persisted = await navigator.storage.persist();
    } catch {
      PWA.persisted = null;
    }
  },

  async usage() {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    try {
      const { usage } = await navigator.storage.estimate();
      return usage || 0;
    } catch {
      return null;
    }
  },

  /** Human-readable storage state for the settings page. */
  statusLabel() {
    if (!PWA.hosted) return 'Dibuka dari berkas lokal';
    if (PWA.persisted === true) return 'Aman — tidak akan dihapus otomatis';
    if (PWA.persisted === false) return 'Standar — bisa dihapus jika memori penuh';
    return 'Memeriksa…';
  },
};

/* ============================================================
   Backup reminder
   ============================================================ */

const BACKUP_NAG_DAYS = 7;

const Backup = {
  dismissed: false,          // per session only, so it returns tomorrow

  /**
   * The last backup as a local 'YYYY-MM-DD' key.
   * Earlier builds stored a UTC ISO timestamp, whose first ten characters
   * are the *UTC* date — an export at 06:00 in UTC+7 would read as
   * yesterday. Both shapes are normalised to the local day here.
   */
  lastKey() {
    const at = Store.data.settings.lastBackupAt;
    if (!at) return null;
    return at.length === 10 ? at : U.key(new Date(at));
  },

  /** Days since the last export, or null if there has never been one. */
  daysSince() {
    const key = Backup.lastKey();
    if (!key) return null;
    return Math.max(0, Math.round((U.parse(U.today()) - U.parse(key)) / 86400000));
  },

  /** Only nags once there is something worth losing. */
  isDue() {
    if (Backup.dismissed) return false;
    if (!Store.data.transactions.length) return false;
    const d = Backup.daysSince();
    return d === null || d >= BACKUP_NAG_DAYS;
  },

  banner() {
    if (!Backup.isDue()) return '';
    const d = Backup.daysSince();
    const line = d === null
      ? 'Belum pernah dicadangkan'
      : `Cadangan terakhir ${d} hari lalu`;

    return `<div class="nag">
      <span class="bubble nag__ico">${icon('alert', 18)}</span>
      <div class="nag__mid">
        <b>${line}</b>
        <span>Simpan satu berkas agar catatanmu aman.</span>
      </div>
      <div class="nag__act">
        <button class="btn btn--sm btn--primary" data-act="export">Export</button>
        <button class="icon-btn" data-act="dismiss-nag"
          aria-label="Tutup pengingat">${icon('x', 17)}</button>
      </div>
    </div>`;
  },
};
